<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>タブ・キャラクターの設定</title>
<style>
  body{margin:0;padding:16px 18px;font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;font-size:13px;color:#2b2622;background:#f5f3ef}
  h1{font-size:15px;margin:0 0 6px}
  h2{font-size:13px;margin:16px 0 6px;padding-bottom:3px;border-bottom:2px solid #2b2622}
  p{color:#6b625a;line-height:1.6;margin:0 0 8px;font-size:12px}
  .row{display:flex;gap:6px;margin:0 0 6px}
  .row input{flex:1;height:30px;border:1px solid #cfc8bf;border-radius:7px;padding:0 9px;font:inherit;background:#fff}
  button{font:inherit;border:1px solid #cfc8bf;background:#fff;border-radius:7px;padding:5px 12px;cursor:pointer}
  .del{padding:0 9px;color:#8a8178}
  .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .save{background:#2a9d74;border-color:#2a9d74;color:#fff;font-weight:700}
</style>
</head>
<body>
<h1>タブ・キャラクターの設定</h1>
<p>ココフォリアから自動で読み込めない場合に、ここで手動設定してください。閲覧用HTMLの送信バーと本文コピーの選択肢に表示されます。</p>
<h2>チャットタブ</h2>
<p>ココフォリア側のタブ名と<b>完全に同じ</b>名前にしてください。</p>
<div id="tabs"></div>
<button data-add="tabs">＋ タブを追加</button>
<h2>キャラクター（送信者）</h2>
<p>送信者として使うキャラクター名です。送信時、ココフォリアの名前欄にこの名前が入ります。</p>
<div id="chars"></div>
<button data-add="chars">＋ キャラクターを追加</button>
<div class="foot"><button id="cancel">キャンセル</button><button class="save" id="save">保存</button></div>
<script>
  const PH = { tabs: 'タブ名（例：情報、雑談、KPC）', chars: 'キャラクター名（例：煙々羅、NPC花子）' };
  function row(kind, v) {
    const box = document.getElementById(kind);
    const d = document.createElement('div'); d.className = 'row';
    const i = document.createElement('input'); i.value = v || ''; i.placeholder = PH[kind];
    const x = document.createElement('button'); x.className = 'del'; x.textContent = '🗑'; x.onclick = () => d.remove();
    d.appendChild(i); d.appendChild(x); box.appendChild(d); return i;
  }
  shellApi.getTabs().then((v) => {
    v = v || {};
    ((v.tabs && v.tabs.length) ? v.tabs : ['']).forEach((t) => row('tabs', t));
    ((v.chars && v.chars.length) ? v.chars : ['']).forEach((t) => row('chars', t));
  });
  document.querySelectorAll('[data-add]').forEach((b) => { b.onclick = () => row(b.getAttribute('data-add'), '').focus(); });
  document.getElementById('cancel').onclick = () => window.close();
  const vals = (id) => Array.from(document.querySelectorAll('#' + id + ' input')).map((i) => i.value);
  document.getElementById('save').onclick = () => shellApi.setTabs({ tabs: vals('tabs'), chars: vals('chars') });
</script>
</body>
</html>
