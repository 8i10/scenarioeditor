<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>配置図</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2c2c3c">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./offline.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f4f6; --surface:#fff; --surface2:#f0f0f3; --border:#e2e2e8;
  --text:#2a2a33; --text-muted:#9a9aa6; --accent:#5b7cfa; --accent2:#3a7bd5; --danger:#c0392b;
}
body{font-family:'Zen Kaku Gothic New','MS PGothic',sans-serif;font-size:13px;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
/* ヘッダー */
#hdr{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
#hdr .back{font-size:18px;text-decoration:none;color:var(--text);padding:2px 6px;border-radius:5px}
#hdr .back:hover{background:var(--surface2)}
#title_in{flex:1;min-width:0;border:none;font-size:15px;font-weight:700;background:transparent;color:var(--text);outline:none;padding:4px}
#title_in:focus{background:var(--surface2);border-radius:5px}
.hbtn{font-size:12px;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.hbtn:hover{background:var(--surface2)}
.hbtn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.hbtn.primary:hover{opacity:.9}
/* 本体 */
#main{flex:1;display:flex;min-height:0}
/* 左パレット */
#palette{width:300px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
#pal_search{margin:10px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface2);color:var(--text);outline:none}
#pal_grid{flex:1;overflow-y:auto;padding:0 12px 14px;display:grid;--ps:60px;grid-template-columns:repeat(auto-fill,minmax(var(--ps),1fr));gap:22px 14px;align-content:start}
.pal-item{position:relative;aspect-ratio:1;border-radius:50%;cursor:pointer;background-color:var(--surface2);background-size:cover;background-position:center;border:2px solid transparent;transition:border-color .1s;overflow:visible}
.pal-item:hover{border-color:var(--accent)}
.pal-item .nm{position:absolute;inset:auto -6px -15px -6px;font-size:9px;text-align:center;color:var(--text);padding:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none}
.pal-empty-letter{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:20px;color:var(--text-muted);font-weight:700}
#pal_foot{border-top:1px solid var(--border);padding:10px}
#pal_foot .row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#pal_foot label{font-size:11px;color:var(--text-muted);white-space:nowrap}
#icon_size{flex:1}
#size_val{font-size:11px;color:var(--text-muted);min-width:34px;text-align:right}
.pal-upload{display:block;text-align:center;font-size:12px;padding:7px;border:1px dashed var(--border);border-radius:7px;cursor:pointer;color:var(--text-muted)}
.pal-upload:hover{border-color:var(--accent);color:var(--accent)}
/* 中央キャンバス */
#stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;background:var(--bg)}
#canvas_wrap{position:relative;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.12);background-size:contain;background-repeat:no-repeat;background-position:center;width:min(760px,100%);aspect-ratio:1/1;flex-shrink:0;user-select:none;touch-action:none}
.ic{position:absolute;border-radius:50%;background-size:cover;background-position:center;cursor:grab;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transform:translate(-50%,-50%);aspect-ratio:1}
.ic.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 1px 6px rgba(0,0,0,.4)}
.ic.dragging{cursor:grabbing}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13px;pointer-events:none;text-align:center;padding:20px}
/* 右の操作列 */
#side{width:46px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
#side button{width:34px;height:34px;border:1px solid var(--border);background:var(--surface);border-radius:8px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
#side button:hover{background:var(--surface2)}
#side button:disabled{opacity:.35;cursor:default}
#side .sep{width:26px;height:1px;background:var(--border);margin:2px 0}
/* モーダル */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.ov.on{display:flex}
.mbox{background:var(--surface);border-radius:10px;padding:16px;width:100%;max-width:440px;max-height:82vh;display:flex;flex-direction:column}
.mbox h3{font-size:15px;margin-bottom:10px}
#saved_list{overflow:auto;flex:1}
.sv-row{display:flex;align-items:center;gap:8px;padding:9px 8px;border-bottom:1px solid var(--border);cursor:pointer}
.sv-row:hover{background:var(--surface2)}
.sv-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-row .d{font-size:10px;color:var(--text-muted)}
.sv-row .del{color:var(--danger);cursor:pointer;padding:2px 6px;border:none;background:none;font-size:14px}
.mbox .mact{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2a2a33;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:200}
#toast.on{opacity:1}
#login_note{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--bg);z-index:300;flex-direction:column;gap:12px;text-align:center;padding:30px}
#login_note a{color:var(--accent2)}
@media(max-width:700px){
  #palette{width:220px}
}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <a href="index.html" class="back" title="一覧へ戻る">←</a>
    <input id="title_in" type="text" placeholder="配置図のタイトル…" value="無題の配置図">
    <button class="hbtn" onclick="openSaved()">📂 保存一覧</button>
    <button class="hbtn" onclick="newPlacement()">🆕 新規</button>
    <button class="hbtn" onclick="exportPNG()">⬇ PNG保存</button>
    <button class="hbtn primary" onclick="savePlacement()">💾 保存</button>
  </div>
  <div id="main">
    <div id="palette">
      <input id="pal_search" type="text" placeholder="名前で検索" oninput="renderPalette()">
      <div id="pal_grid"></div>
      <div id="pal_foot">
        <div class="row"><label>アイコンサイズ</label><input id="icon_size" type="range" min="40" max="120" value="60" oninput="onSizeSlider(this.value)"><span id="size_val">60px</span></div>
        <div style="font-size:10px;color:var(--text-muted);margin-bottom:8px">※一覧の表示サイズ。配置後のアイコンは選択してホイールで拡大縮小できます。</div>
        <label class="pal-upload" for="up_icon">＋ 画像をアップロードして配置</label>
        <input id="up_icon" type="file" accept="image/*" style="display:none" onchange="uploadIcon(this)">
      </div>
    </div>
    <div id="stage">
      <div id="canvas_wrap">
        <div id="hint">左のアイコンをクリックして配置／背景は右の🖼ボタンから</div>
      </div>
    </div>
    <div id="side">
      <button title="背景画像を設定" onclick="document.getElementById('up_bg').click()">🖼</button>
      <button id="btn_delbg" title="背景を削除" onclick="clearBg()" disabled>🗑</button>
      <div class="sep"></div>
      <button id="btn_front" title="選択を前面へ" onclick="bringFront()" disabled>⬆</button>
      <button id="btn_back" title="選択を背面へ" onclick="sendBack()" disabled>⬇</button>
      <button id="btn_del" title="選択を削除(Delete)" onclick="delSelected()" disabled>✕</button>
      <input id="up_bg" type="file" accept="image/*" style="display:none" onchange="uploadBg(this)">
    </div>
  </div>
</div>

<div class="ov" id="saved_ov" onclick="if(event.target===this)closeSaved()">
  <div class="mbox">
    <h3>📂 保存した配置図</h3>
    <div id="saved_list"></div>
    <div class="mact"><button class="hbtn" onclick="closeSaved()">閉じる</button></div>
  </div>
</div>

<div id="login_note">
  <div style="font-size:15px;font-weight:700">ログインが必要です</div>
  <div style="color:var(--text-muted)">登録済みのPCアイコンを読み込むには、まず<br><a href="index.html">一覧ページ</a>でログインしてください。</div>
  <a class="hbtn" href="index.html" style="text-decoration:none">一覧ページへ</a>
</div>

<div id="toast"></div>

<script>
const SUPABASE_URL='https://cicodhxebyqewfnngfwt.supabase.co/';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpY29kaHhlYnlxZXdmbm5nZnd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzM4NDYsImV4cCI6MjA5NTY0OTg0Nn0.huLOglTPbW1CcGDbDB_yf5ftqEkqmtJ1HBY9WTx9J8E';
const {createClient}=supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
const PLACEMENT_TABLE='coc_placements';

let USER=null;
let palItems=[];        // {id,name,url,pos,scale}  パレット候補
let icons=[];           // 配置中: {uid,url,pos,scale,fx,fy,fsize,name}
let bg={url:'',aspect:1};
let selected=null;      // uid
let currentId=null;     // 保存済みの配置図ID（更新用）
let defaultSize=60;
const PLACED_DEFAULT=64;   // キャンバスに置くアイコンの既定サイズ(px)

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200);}
function fixDropboxUrl(url){
  if(!url)return'';
  if(url.includes('dropbox.com')){
    let u=url.replace('www.dropbox.com','dl.dropboxusercontent.com').replace('dropbox.com','dl.dropboxusercontent.com');
    u=u.replace(/([?&])dl=[01]/,'$1raw=1');
    if(!/[?&]raw=1/.test(u))u+=(u.includes('?')?'&':'?')+'raw=1';
    return u;
  }
  return url;
}

/* ===== 初期化：ログイン確認＋PC読込 ===== */
async function init(){
  const {data:{user}}=await db.auth.getUser();
  if(!user){ document.getElementById('login_note').style.display='flex'; return; }
  USER=user;
  await loadPCs();
}
async function loadPCs(){
  try{
    const {data:list,error}=await db.from('character_sheets')
      .select('id,char_name,data').eq('user_id',USER.id).order('updated_at',{ascending:false});
    if(error)throw error;
    palItems=(list||[]).map(c=>{
      let s={};try{s=JSON.parse(c.data)||{};}catch(e){}
      const inp=s.inputs||{};
      const img=inp.charImage?fixDropboxUrl(inp.charImage):'';
      return {id:c.id,name:(inp.pcname||c.char_name||'(無名)').trim(),url:img,pos:inp.charImagePos||'50% 30%',scale:parseFloat(inp.charImageScale)||1.3};
    });
    renderPalette();
  }catch(e){ toast('PC読込に失敗: '+(e.message||e)); }
}

/* ===== パレット描画 ===== */
function renderPalette(){
  const q=(document.getElementById('pal_search').value||'').trim().toLowerCase();
  const grid=document.getElementById('pal_grid');
  const items=palItems.filter(it=>!q||it.name.toLowerCase().includes(q));
  grid.innerHTML=items.map((it,i)=>{
    const idx=palItems.indexOf(it);
    if(it.url){
      const posArr=(it.pos||'50% 30%').split(' ');
      const style=`background-image:url('${esc(it.url)}');background-size:${Math.round(it.scale*100)}%;background-position:${esc(posArr[0]||'50%')} ${esc(posArr[1]||'30%')}`;
      return `<div class="pal-item" style="${style}" title="${esc(it.name)}" onclick="placeFromPalette(${idx})"><span class="nm">${esc(it.name)}</span></div>`;
    }
    return `<div class="pal-item" title="${esc(it.name)}（画像なし）" onclick="placeFromPalette(${idx})"><span class="pal-empty-letter">${esc(it.name.charAt(0)||'?')}</span><span class="nm">${esc(it.name)}</span></div>`;
  }).join('') || '<div style="grid-column:1/-1;color:var(--text-muted);font-size:12px;text-align:center;padding:20px 0">該当なし</div>';
}

/* ===== アイコン配置 ===== */
let _uid=1;
function placeFromPalette(idx){
  const it=palItems[idx]; if(!it)return;
  addIcon({url:it.url,pos:it.pos,scale:it.scale,name:it.name});
}
function addIcon(o){
  const wrap=document.getElementById('canvas_wrap');
  const w=wrap.clientWidth||760, h=wrap.clientHeight||760;
  const n=icons.length;
  const ic={
    uid:_uid++, url:o.url||'', pos:o.pos||'50% 50%', scale:o.scale||1,
    name:o.name||'',
    fsize: (o.fsize!=null? o.fsize : PLACED_DEFAULT/w*100),  // キャンバス幅に対する%
    fx: 50 + ((n%5)-2)*6,                      // 中央付近に少しずつずらして配置
    fy: 50 + (Math.floor(n/5)%5-2)*6
  };
  ic.fx=Math.max(3,Math.min(97,ic.fx)); ic.fy=Math.max(3,Math.min(97,ic.fy));
  icons.push(ic);
  renderIcons(); selectIcon(ic.uid);
}
function renderIcons(){
  const wrap=document.getElementById('canvas_wrap');
  // 既存の .ic を消して描き直し（zは配列順）
  [...wrap.querySelectorAll('.ic')].forEach(e=>e.remove());
  document.getElementById('hint').style.display = (icons.length||bg.url)?'none':'flex';
  icons.forEach(ic=>{
    const d=document.createElement('div');
    d.className='ic'+(selected===ic.uid?' sel':'');
    d.dataset.uid=ic.uid;
    d.style.left=ic.fx+'%'; d.style.top=ic.fy+'%'; d.style.width=ic.fsize+'%';
    if(ic.url){
      const p=(ic.pos||'50% 50%').split(' ');
      d.style.backgroundImage=`url('${ic.url}')`;
      d.style.backgroundSize=Math.round(ic.scale*100)+'%';
      d.style.backgroundPosition=(p[0]||'50%')+' '+(p[1]||'50%');
    }else{
      d.style.background='var(--surface2)';
      d.innerHTML=`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text-muted);border-radius:50%">${esc((ic.name||'?').charAt(0))}</div>`;
    }
    wrap.appendChild(d);
  });
}
function selectIcon(uid){
  selected=uid; renderIcons();
  const has=uid!=null;
  ['btn_del','btn_front','btn_back'].forEach(id=>document.getElementById(id).disabled=!has);
}
function delSelected(){ if(selected==null)return; icons=icons.filter(i=>i.uid!==selected); selected=null; selectIcon(null); renderIcons(); }
function bringFront(){ const i=icons.findIndex(x=>x.uid===selected); if(i<0)return; const[o]=icons.splice(i,1); icons.push(o); renderIcons(); }
function sendBack(){ const i=icons.findIndex(x=>x.uid===selected); if(i<0)return; const[o]=icons.splice(i,1); icons.unshift(o); renderIcons(); }
// スライダー＝一覧（パレット）のアイコン表示サイズ。列は自動調整
function onSizeSlider(v){
  const px=parseInt(v)||60;
  document.getElementById('pal_grid').style.setProperty('--ps', px+'px');
  document.getElementById('size_val').textContent=px+'px';
}
// 配置後アイコンをホイールで拡大縮小
document.getElementById('canvas_wrap').addEventListener('wheel',e=>{
  const t=e.target.closest('.ic'); if(!t)return;
  e.preventDefault();
  const uid=parseInt(t.dataset.uid); const ic=icons.find(i=>i.uid===uid); if(!ic)return;
  selectIcon(uid);
  const w=document.getElementById('canvas_wrap').clientWidth||760;
  let px=ic.fsize/100*w + (e.deltaY<0?4:-4);
  px=Math.max(18,Math.min(320,px));
  ic.fsize=px/w*100; renderIcons();
},{passive:false});

/* ===== ドラッグ ===== */
let drag=null;
document.getElementById('canvas_wrap').addEventListener('pointerdown',e=>{
  const t=e.target.closest('.ic');
  if(!t){ selectIcon(null); return; }
  const uid=parseInt(t.dataset.uid);
  selectIcon(uid);
  const ic=icons.find(i=>i.uid===uid); if(!ic)return;
  const wrap=document.getElementById('canvas_wrap');
  const r=wrap.getBoundingClientRect();
  drag={uid,r,dx:(e.clientX-r.left)/r.width*100-ic.fx,dy:(e.clientY-r.top)/r.height*100-ic.fy};
  t.classList.add('dragging'); t.setPointerCapture(e.pointerId);
  e.preventDefault();
});
document.getElementById('canvas_wrap').addEventListener('pointermove',e=>{
  if(!drag)return;
  const ic=icons.find(i=>i.uid===drag.uid); if(!ic)return;
  let fx=(e.clientX-drag.r.left)/drag.r.width*100-drag.dx;
  let fy=(e.clientY-drag.r.top)/drag.r.height*100-drag.dy;
  ic.fx=Math.max(0,Math.min(100,fx)); ic.fy=Math.max(0,Math.min(100,fy));
  const el=document.querySelector('.ic[data-uid="'+drag.uid+'"]');
  if(el){el.style.left=ic.fx+'%';el.style.top=ic.fy+'%';}
});
document.getElementById('canvas_wrap').addEventListener('pointerup',e=>{
  if(drag){const el=document.querySelector('.ic[data-uid="'+drag.uid+'"]');if(el)el.classList.remove('dragging');drag=null;}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Delete'||e.key==='Backspace')&&selected!=null&&document.activeElement.tagName!=='INPUT'){ delSelected(); e.preventDefault(); }
});

/* ===== 背景 ===== */
function applyBg(){
  const wrap=document.getElementById('canvas_wrap');
  wrap.style.backgroundImage=bg.url?`url('${bg.url}')`:'none';
  wrap.style.aspectRatio=(bg.aspect||1)+' / 1';
  document.getElementById('btn_delbg').disabled=!bg.url;
  document.getElementById('hint').style.display=(icons.length||bg.url)?'none':'flex';
}
function uploadBg(inp){
  const f=inp.files&&inp.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{ const im=new Image(); im.onload=()=>{ bg={url:rd.result,aspect:im.naturalWidth/im.naturalHeight}; applyBg(); }; im.src=rd.result; };
  rd.readAsDataURL(f); inp.value='';
}
function clearBg(){ bg={url:'',aspect:1}; applyBg(); }
function uploadIcon(inp){
  const f=inp.files&&inp.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{ addIcon({url:rd.result,pos:'50% 50%',scale:1,name:f.name.replace(/\.[^.]+$/,'')}); };
  rd.readAsDataURL(f); inp.value='';
}

/* ===== PNG出力（オフスクリーンcanvasに直接描画） ===== */
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=()=>rej(new Error('img'));im.src=src;});}
async function exportPNG(){
  try{
    toast('画像を生成中…');
    const aspect=bg.aspect||1;
    const W=1400, H=Math.round(W/aspect);
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const ctx=cv.getContext('2d');
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
    let tainted=false;
    if(bg.url){ try{ const bim=await loadImg(bg.url); ctx.drawImage(bim,0,0,W,H);}catch(e){} }
    for(const ic of icons){
      const D=ic.fsize/100*W;
      const cx=ic.fx/100*W, cy=ic.fy/100*H;
      ctx.save();
      ctx.beginPath(); ctx.arc(cx,cy,D/2,0,Math.PI*2); ctx.closePath();
      ctx.fillStyle='#ffffff'; ctx.fill(); ctx.clip();
      if(ic.url){
        try{
          const im=await loadImg(ic.url);
          const sW=D*ic.scale, sH=sW*(im.naturalHeight/im.naturalWidth);
          const p=(ic.pos||'50% 50%').split(' ');
          const px=parseFloat(p[0])/100||0.5, py=parseFloat(p[1])/100||0.5;
          const ox=(D-sW)*px, oy=(D-sH)*py;
          ctx.drawImage(im, cx-D/2+ox, cy-D/2+oy, sW, sH);
        }catch(e){ tainted=true; }
      }else{
        ctx.fillStyle='#f0f0f3'; ctx.fillRect(cx-D/2,cy-D/2,D,D);
        ctx.fillStyle='#9a9aa6'; ctx.font='bold '+(D*0.5)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText((ic.name||'?').charAt(0),cx,cy);
      }
      ctx.restore();
      // 白フチ
      ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,D/2,0,Math.PI*2);
      ctx.lineWidth=Math.max(2,D*0.03); ctx.strokeStyle='#ffffff'; ctx.stroke(); ctx.restore();
    }
    let dataUrl;
    try{ dataUrl=cv.toDataURL('image/png'); }
    catch(e){ toast('画像にCORS制限のある画像が含まれPNG化できませんでした'); return; }
    const a=document.createElement('a');
    a.href=dataUrl;
    a.download=((document.getElementById('title_in').value||'配置図').replace(/[\\/:*?"<>|]/g,'_'))+'.png';
    document.body.appendChild(a); a.click(); a.remove();
    if(tainted) toast('一部アイコンは読込不可のため省略されました');
  }catch(e){ toast('PNG生成エラー: '+(e.message||e)); }
}

/* ===== Supabase保存／読込 ===== */
function _placementData(){
  return { title:document.getElementById('title_in').value||'無題の配置図',
    bg, icons: icons.map(i=>({url:i.url,pos:i.pos,scale:i.scale,fx:i.fx,fy:i.fy,fsize:i.fsize,name:i.name})) };
}
async function savePlacement(){
  if(!USER){ toast('ログインが必要です'); return; }
  const payload={ user_id:USER.id, title:document.getElementById('title_in').value||'無題の配置図', data:_placementData(), updated_at:new Date().toISOString() };
  try{
    let res;
    if(currentId){ res=await db.from(PLACEMENT_TABLE).update(payload).eq('id',currentId).select('id').single(); }
    else { res=await db.from(PLACEMENT_TABLE).insert(payload).select('id').single(); }
    if(res.error)throw res.error;
    currentId=res.data.id;
    toast('保存しました');
  }catch(e){
    const msg=(e.message||e)+'';
    if(/relation|does not exist|not find|schema cache|404/i.test(msg)){
      toast('保存用テーブルが未作成です（下記SQLをSupabaseで実行してください）');
      alert('配置図の保存には Supabase に専用テーブルが必要です。\nSupabaseのSQLエディタで以下を1度だけ実行してください:\n\n'+SQL_SETUP);
    }else{ toast('保存に失敗: '+msg); }
  }
}
const SQL_SETUP=`create table if not exists coc_placements (
  id uuid primary key default gen_random_uuid(),
  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
  title text,
  data jsonb,
  updated_at timestamptz default now()
);
alter table coc_placements enable row level security;
create policy "own_placements" on coc_placements
  for all using (auth.uid() = user_id) with check (auth.uid() = user_id);`;

async function openSaved(){
  const ov=document.getElementById('saved_ov'); ov.classList.add('on');
  const list=document.getElementById('saved_list'); list.innerHTML='<div style="padding:16px;color:var(--text-muted)">読込中…</div>';
  if(!USER){ list.innerHTML='<div style="padding:16px;color:var(--text-muted)">ログインが必要です</div>'; return; }
  try{
    const {data,error}=await db.from(PLACEMENT_TABLE).select('id,title,updated_at').eq('user_id',USER.id).order('updated_at',{ascending:false});
    if(error)throw error;
    if(!data||!data.length){ list.innerHTML='<div style="padding:16px;color:var(--text-muted)">保存された配置図はありません</div>'; return; }
    list.innerHTML=data.map(r=>{
      const dt=new Date(r.updated_at); const ds=`${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()} ${('0'+dt.getHours()).slice(-2)}:${('0'+dt.getMinutes()).slice(-2)}`;
      return `<div class="sv-row" onclick="loadPlacement('${r.id}')"><div class="t">${esc(r.title||'無題')}<div class="d">${ds}</div></div><button class="del" title="削除" onclick="event.stopPropagation();deletePlacement('${r.id}')">🗑</button></div>`;
    }).join('');
  }catch(e){
    const msg=(e.message||e)+'';
    if(/relation|does not exist|not find|schema cache|404/i.test(msg)) list.innerHTML='<div style="padding:16px;color:var(--text-muted)">保存用テーブルが未作成です。<br>一度「保存」を押すと作成用SQLが表示されます。</div>';
    else list.innerHTML='<div style="padding:16px;color:var(--danger)">読込失敗: '+esc(msg)+'</div>';
  }
}
function closeSaved(){ document.getElementById('saved_ov').classList.remove('on'); }
async function loadPlacement(id){
  try{
    const {data,error}=await db.from(PLACEMENT_TABLE).select('id,title,data').eq('id',id).single();
    if(error)throw error;
    const d=data.data||{};
    document.getElementById('title_in').value=data.title||d.title||'無題の配置図';
    bg=d.bg||{url:'',aspect:1};
    icons=(d.icons||[]).map(i=>({uid:_uid++,url:i.url||'',pos:i.pos||'50% 50%',scale:i.scale||1,fx:i.fx,fy:i.fy,fsize:i.fsize,name:i.name||''}));
    currentId=data.id; selected=null;
    applyBg(); renderIcons(); selectIcon(null); closeSaved();
    toast('読み込みました');
  }catch(e){ toast('読込失敗: '+(e.message||e)); }
}
async function deletePlacement(id){
  if(!confirm('この配置図を削除しますか？'))return;
  try{ const {error}=await db.from(PLACEMENT_TABLE).delete().eq('id',id); if(error)throw error;
    if(currentId===id)currentId=null; toast('削除しました'); openSaved();
  }catch(e){ toast('削除失敗: '+(e.message||e)); }
}
function newPlacement(){
  if(icons.length&&!confirm('現在の配置をクリアして新規作成しますか？（未保存の内容は失われます）'))return;
  icons=[]; bg={url:'',aspect:1}; selected=null; currentId=null;
  document.getElementById('title_in').value='無題の配置図';
  applyBg(); renderIcons(); selectIcon(null);
}

init();
