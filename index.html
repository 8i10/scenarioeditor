<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シナリオエディタ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho+B1:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --fs:1;
    --bg:#fdfcfa; --card:#ffffff; --box:#f4f1ea; --line:#e4ded2;
    --text:#2b2724; --muted:#8a8175; --accent:#5b5348; --accent2:#8c8375;
    --red:#8b0000; --blue:#0000ff;
    --kp-bg:#3a3a3a; --kp-text:#f2f0ec; --pl-edge:#1e1e1e;
    --hover:#f0ece3; --sel:rgba(139,0,0,.10);
    --header-bg:#2b2724; --header-text:#f6f2ea;
  }
  html[data-theme="dark"]{
    --bg:#1b1916; --card:#26231f; --box:#302c26; --line:#3c372f;
    --text:#ece7df; --muted:#a89e90; --accent:#cabfae; --accent2:#9a8f7e;
    --red:#e0685c; --blue:#7f9bff;
    --kp-bg:#3a352e; --kp-text:#efe9df; --pl-edge:#0b0b0b;
    --hover:#332e28; --sel:rgba(224,104,92,.16);
    --header-bg:#100e0c; --header-text:#f2ede4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--sel)}

  /* ── header ── */
  .head{position:sticky;top:0;z-index:100;background:var(--header-bg)}
  .head-in{max-width:920px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .htitle{font-size:15px;font-weight:800;color:var(--header-text);letter-spacing:.3em;font-family:Arial,Helvetica,sans-serif}
  .save-ind{font-size:11.5px;color:rgba(255,255,255,.5);letter-spacing:.05em;min-width:118px}
  .head .sp{margin-left:auto}
  .hbtn{font-family:inherit;font-size:12.5px;color:#eee;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);border-radius:7px;padding:6px 11px;cursor:pointer;transition:.14s}
  .hbtn:hover{background:rgba(255,255,255,.18)}
  .seg{display:inline-flex;border:1px solid rgba(255,255,255,.16);border-radius:7px;overflow:hidden}
  .seg button{font-family:inherit;font-size:12.5px;color:#eee;background:transparent;border:0;padding:6px 12px;cursor:pointer}
  .seg button.on{background:rgba(255,255,255,.2);font-weight:700}
  .seg button+button{border-left:1px solid rgba(255,255,255,.16)}

  /* ── format bar ── */
  .fbar{background:var(--card);border-bottom:1px solid var(--line)}
  .fbar-in{max-width:none;width:100%;margin:0;padding:7px 16px;display:flex;align-items:center;gap:9px;flex-wrap:nowrap;overflow-x:auto}
  .fbar-in::-webkit-scrollbar{height:6px}
  .fbar-in::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .fbar-toggle{display:none}
  .fbar .lb{font-size:11px;color:var(--muted);letter-spacing:.08em;white-space:nowrap;flex:none}
  .fbar .sepline{width:1px;height:18px;background:var(--line);flex:none}
  .fbar .fb{width:26px;height:24px;border:1px solid var(--line);border-radius:5px;background:var(--bg);
    color:var(--text);cursor:pointer;font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  .fbar .fb:hover{background:var(--hover)}
  .grp{flex:none}
  .sw{width:20px;height:20px;border-radius:5px;border:1px solid var(--line);cursor:pointer;padding:0;position:relative}
  .sw:hover{transform:scale(1.1)}
  .sw.none::after{content:"╱";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
  .grp{display:inline-flex;align-items:center;gap:5px}
  input.ci{width:26px;height:24px;border:1px solid var(--line);border-radius:5px;padding:0;background:none;cursor:pointer}
  input.hex{width:76px;height:24px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--text);font-size:11.5px;font-family:"Cascadia Code",ui-monospace,monospace;padding:0 6px}
  .grp .mini{width:16px;height:16px;border-radius:4px;border:1px solid var(--line);cursor:pointer;padding:0}
  .grp .mini:hover{transform:scale(1.12)}
  .grp .clr{font-size:11px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:5px;padding:2px 6px;cursor:pointer}
  .grp .clr:hover{background:var(--hover);color:var(--text)}

  /* ── page ── */
  .wrap{max-width:920px;margin:0 auto;padding:30px 24px 45vh;font-size:calc(16px * var(--fs))}

  /* ── block ── */
  .block{position:relative;margin:1px 0;border-radius:5px}
  .block>.gutter{position:absolute;left:-46px;top:2px;display:flex;gap:2px;opacity:0;transition:.12s;height:1.7em;align-items:center}
  .block:hover>.gutter,.block:focus-within>.gutter{opacity:1}
  .gutter button{width:20px;height:20px;border:0;background:transparent;color:var(--muted);
    border-radius:5px;cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
  .gutter button:hover{background:var(--hover);color:var(--text)}
  .grip{cursor:grab}
  .block.drag-over{box-shadow:0 -2px 0 var(--red)}
  .block.dragging{opacity:.4}

  .be{outline:0;white-space:pre-wrap;word-break:break-word;min-height:1.55em;padding:1px 2px}
  .be:empty::before{content:attr(data-ph);color:var(--muted);opacity:.6;pointer-events:none}

  .block[data-type="p"]{padding:1px 0}
  .block[data-type="title"] .be{font-family:"Shippori Mincho B1",serif;font-size:2.8em;font-weight:800;text-align:center;letter-spacing:.06em;line-height:1.2;margin:6px 0 2px}
  .block[data-type="tagline"] .be{text-align:center;color:var(--muted);letter-spacing:.16em;font-size:.98em}
  .block[data-type="h1"] .be{font-weight:800;font-size:1.8em;color:var(--text);letter-spacing:.03em;line-height:1.35;margin:26px 0 12px}
  .block[data-type="h2"] .be{font-weight:800;font-size:1.5em;margin:24px 0 10px}
  .block[data-type="h3"] .be{font-weight:700;font-size:1.28em;color:var(--accent);margin:20px 0 6px}
  .block[data-type="h4"] .be{font-weight:700;font-size:1.12em;color:var(--accent);margin:16px 0 5px}
  .block[data-type="h5"] .be{font-weight:700;font-size:1em;color:var(--muted);margin:14px 0 4px}
  .block[data-type="quote"] .be{border-left:3px solid var(--accent2);padding-left:14px;color:var(--accent)}
  .block[data-type="bullet"]{padding-left:20px}
  .block[data-type="bullet"]>.be::before{content:"•";position:absolute;left:4px;color:var(--red)}
  .block[data-type="bullet"]>.be{position:static}
  .block[data-type="bullet"]{position:relative}
  .block[data-type="todo"]{padding-left:24px;position:relative}
  .block[data-type="todo"]>.tick{position:absolute;left:2px;top:.28em;width:15px;height:15px;border:1.5px solid var(--accent2);border-radius:3px;cursor:pointer;background:var(--card)}
  .block[data-type="todo"].done>.tick{background:var(--red);border-color:var(--red)}
  .block[data-type="todo"].done>.tick::after{content:"✓";color:#fff;font-size:11px;position:absolute;left:2px;top:-3px}
  .block[data-type="todo"].done>.be{color:var(--muted);text-decoration:line-through}
  .block[data-type="divider"]{padding:9px 0}
  .block[data-type="divider"] hr{border:0;border-top:1px solid var(--line);margin:0}

  /* container (toggle / toggle-heading / callout) */
  .chead{display:flex;align-items:center;gap:4px}
  .tri{flex:none;width:22px;height:1.5em;border:0;background:transparent;cursor:pointer;color:var(--accent2);font-size:calc(16px * var(--fs) - 1px);line-height:1;display:flex;align-items:center;justify-content:center;transition:transform .12s}
  .block.collapsed>.chead .tri{transform:rotate(-90deg)}
  .chead .be{flex:1}
  .children{margin:3px 0 4px 20px;border-left:1px solid var(--line);padding-left:12px}
  .block.collapsed>.children{display:none}
  .addchild{font-size:11.5px;color:var(--muted);background:transparent;border:0;cursor:pointer;padding:3px 4px;border-radius:5px}
  .addchild:hover{background:var(--hover);color:var(--text)}

  .block[data-type="toggle"]>.chead .be{font-weight:500}
  .block[data-type="th1"]>.chead .be{font-weight:800;font-size:1.7em}
  .block[data-type="th2"]>.chead .be{font-weight:800;font-size:1.45em}
  .block[data-type="th3"]>.chead .be{font-weight:700;font-size:1.25em}
  .block[data-type="th4"]>.chead .be{font-weight:700;font-size:1.1em}
  .block[data-type="th5"]>.chead .be{font-weight:700;font-size:1em;color:var(--muted)}

  /* callout（KP情報 / PL情報 / 技能情報）：左上バッジ + 本文 */
  .block[data-type="kp"],.block[data-type="info"],.block[data-type="skill"]{
    position:relative;border-radius:7px;padding:13px 14px 9px;margin:17px 0 10px}
  .block[data-type="kp"] .lbl,.block[data-type="info"] .lbl,.block[data-type="skill"] .lbl{
    position:absolute;top:-10px;left:12px;min-height:0;font-weight:700;font-size:11.5px;
    letter-spacing:.08em;line-height:1.3;padding:2px 10px;border-radius:4px}
  .block[data-type="info"] .lbl,.block[data-type="skill"] .lbl{font-size:13.5px;top:-12px}
  .block[data-type="kp"] .lbl:empty::before,.block[data-type="info"] .lbl:empty::before,.block[data-type="skill"] .lbl:empty::before{opacity:.85}
  .block[data-type="kp"]>.children,.block[data-type="info"]>.children,.block[data-type="skill"]>.children{
    margin:0;border-left:0;padding-left:0}

  /* KP情報：塗りつぶしのダーク枠・白抜き文字 */
  .block[data-type="kp"]{background:var(--kp-bg);color:var(--kp-text)}
  .block[data-type="kp"] .be{color:var(--kp-text)}
  .block[data-type="kp"] .lbl{background:var(--kp-bg);color:var(--kp-text);border:1px solid rgba(255,255,255,.22)}
  .block[data-type="kp"] .addchild{color:rgba(255,255,255,.55)}
  .block[data-type="kp"] .addchild:hover{background:rgba(255,255,255,.12);color:#fff}

  /* PL情報：ライト枠・左端だけ黒 */
  .block[data-type="info"]{background:var(--card);border:1px solid var(--pl-edge);border-left-width:4px}
  .block[data-type="info"] .lbl{background:var(--pl-edge);color:#fff}

  /* 技能情報：ライト枠・左端と見出しだけ青 */
  .block[data-type="skill"]{background:var(--card);border:1px solid var(--blue);border-left-width:4px}
  .block[data-type="skill"] .lbl{background:var(--blue);color:#fff}

  /* ── menu ── */
  .menu{position:absolute;z-index:200;width:264px;max-height:340px;overflow:auto;background:var(--card);
    border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.22);padding:6px;display:none}
  .menu.show{display:block}
  .menu .mcat{font-size:10px;letter-spacing:.14em;color:var(--muted);padding:7px 10px 3px}
  .menu button{display:flex;width:100%;align-items:center;gap:11px;text-align:left;background:transparent;border:0;border-radius:7px;padding:7px 10px;cursor:pointer;color:var(--text)}
  .menu button:hover,.menu button.sel{background:var(--hover)}
  .menu .ic{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--accent2);font-family:"Shippori Mincho B1",serif}
  .menu .nm{font-size:13px}
  .menu .dv{height:1px;background:var(--line);margin:5px 2px}

  /* ── しおり（左サイドバー・開閉可） ── */
  .outline{position:fixed;top:0;left:0;width:236px;height:100vh;overflow:auto;background:var(--card);
    border-right:1px solid var(--line);z-index:90;padding:56px 4px 30px;transform:translateX(-100%);
    transition:transform .18s;box-shadow:2px 0 14px rgba(0,0,0,.05)}
  .outline.open{transform:none}
  .outline .ol-ttl{font-size:11px;letter-spacing:.2em;color:var(--muted);padding:4px 12px 9px;
    border-bottom:1px solid var(--line);margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
  .outline .ol-x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 4px}
  .outline .ol-x:hover{color:var(--text)}
  .outline a{display:block;text-decoration:none;color:var(--accent);font-size:12.5px;line-height:1.5;
    padding:5px 12px;border-left:2px solid transparent;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .outline a:hover{background:var(--hover);color:var(--text);border-left-color:var(--accent2)}
  .outline a.lv2{padding-left:24px;font-size:12px}
  .outline a.lv3{padding-left:36px;font-size:12px;color:var(--accent)}
  .outline a.lv4{padding-left:48px;font-size:11.5px;color:var(--accent2)}
  .outline a.lv5{padding-left:60px;font-size:11.5px;color:var(--accent2)}
  .outline .ol-empty{padding:12px;color:var(--muted);font-size:12px}
  @media (min-width:1240px){ body.ol-open .wrap{margin-left:236px} }

  /* ── ファイル管理ダイアログ ── */
  .ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:300;padding:18px}
  .ovl.show{display:flex}
  .dlg{background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:460px;width:100%;max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
  .dlg-h{font-weight:800;font-size:15px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .dlg-b{padding:16px 20px;overflow:auto}
  .dlg-f{padding:12px 20px;border-top:1px solid var(--line);text-align:right}
  .frow{display:flex;gap:8px;margin:0 0 10px}
  .frow input{flex:1;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);padding:0 10px;font-size:13px;font-family:inherit}
  .fhint{font-size:11.5px;color:var(--muted);margin-bottom:12px;min-height:1em}
  .hb2{font-family:inherit;font-size:12.5px;color:var(--text);background:var(--box);border:1px solid var(--line);border-radius:7px;padding:8px 12px;cursor:pointer}
  .hb2:hover{background:var(--hover)}
  .hb2.pri{background:var(--accent);color:var(--card);border-color:var(--accent);font-weight:700}
  .flist{display:flex;flex-direction:column;gap:6px;margin:6px 0 14px}
  .fitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .fitem.cur{border-color:var(--accent2);background:var(--hover)}
  .fitem .fnm{flex:1;font-size:13px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fitem .fdt{font-size:10.5px;color:var(--muted)}
  .fitem button{font-size:11px;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:3px 5px;border-radius:5px}
  .fitem button:hover{background:var(--hover);color:var(--text)}

  /* ── 印刷（PDF書き出し） ── */
  .print-toc{display:none}
  @media print{
    .head,.fbar,.outline,.menu,.ovl{display:none!important}
    body{background:#fff}
    .wrap{max-width:none;margin:0;padding:0}
    .block>.gutter,.addchild,.tri{display:none!important}
    .be{outline:0}
    .block.collapsed>.children{display:block!important}
    .block,.be{page-break-inside:avoid}
    .print-toc{display:block;margin:0 0 24px;padding-bottom:16px;border-bottom:1px solid #bbb;page-break-after:always}
    .print-toc .pt-h{font-weight:800;font-size:1.5em;margin-bottom:12px;letter-spacing:.04em}
    .print-toc .pt-i{font-size:.98em;line-height:1.95;color:#333}
    .print-toc .pt-i.lv1{font-weight:700}
    .print-toc .pt-i.lv2{padding-left:1.3em}
    .print-toc .pt-i.lv3{padding-left:2.6em}
    .print-toc .pt-i.lv4{padding-left:3.9em}
    .print-toc .pt-i.lv5{padding-left:5.2em}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }

  @media (max-width:820px){
    .fbar-toggle{display:flex;align-items:center;gap:6px;width:100%;background:transparent;border:0;
      color:var(--text);font-size:13px;font-weight:700;padding:9px 16px;cursor:pointer;text-align:left}
    .fbar-toggle::after{content:"▾";margin-left:auto;color:var(--muted)}
    .fbar.open .fbar-toggle::after{content:"▴"}
    .fbar-in{display:none;flex-wrap:wrap;overflow:visible;padding:0 16px 12px;gap:8px 10px}
    .fbar.open .fbar-in{display:flex}
  }
  @media (max-width:640px){
    .wrap{padding:22px 14px 45vh}
    .block>.gutter{left:-28px}
    .htitle{letter-spacing:.18em;font-size:13px}
    .save-ind{display:none}
  }
</style>
</head>
<body>
<div class="head">
  <div class="head-in">
    <button class="hbtn" id="btnOutline">☰ しおり</button>
    <button class="hbtn" id="btnFile">📄 <span id="docName">無題</span></button>
    <span class="save-ind" id="saveInd"></span>
    <span class="sp"></span>
    <div class="seg" id="segFs">
      <button data-fs="sm">小</button>
      <button data-fs="md" class="on">中</button>
    </div>
    <button class="hbtn" id="btnHtml">HTML</button>
    <button class="hbtn" id="btnPdf">PDF</button>
    <button class="hbtn" id="btnTheme">🌙 ダーク</button>
  </div>
</div>
<nav class="outline" id="outline"></nav>

<div class="ovl" id="fileOvl">
  <div class="dlg">
    <div class="dlg-h">シナリオの管理</div>
    <div class="dlg-b">
      <div class="frow"><input type="text" id="fName" placeholder="ファイル名"><button class="hb2 pri" id="fSave">この名前で保存</button></div>
      <div class="fhint" id="fHint"></div>
      <div class="flist" id="fList"></div>
      <div class="frow"><button class="hb2" id="fNew">＋ 新規シナリオ</button></div>
    </div>
    <div class="dlg-f"><button class="hb2" id="fClose">閉じる</button></div>
  </div>
</div>
<div class="fbar" id="fbar">
  <button class="fbar-toggle" id="fbarToggle">書式 ▾</button>
  <div class="fbar-in" id="fbarIn">
    <span class="grp" id="palStyle">
      <button class="fb" data-cmd="bold" title="太字"><b>B</b></button>
      <button class="fb" data-cmd="italic" title="斜体"><i>I</i></button>
      <button class="fb" data-cmd="underline" title="下線"><u>U</u></button>
    </span>
    <span class="sepline"></span>
    <span class="lb">文字色</span><span class="grp" id="palText"></span>
    <span class="sepline"></span>
    <span class="lb">文字背景</span><span class="grp" id="palMark"></span>
    <span class="sepline"></span>
    <span class="lb">行背景</span><span class="grp" id="palRow"></span>
    <span class="sepline"></span>
    <span class="lb">行下線</span><span class="grp" id="palUl"></span>
  </div>
</div>

<div class="wrap"><div class="print-toc" id="printToc"></div><div class="doc" id="doc"></div></div>
<div class="menu" id="menu"></div>

<script>
(function(){
  "use strict";
  var doc=document.getElementById('doc');
  var menu=document.getElementById('menu');
  var saveInd=document.getElementById('saveInd');
  var root=document.documentElement;

  var TYPES=[
    {t:'p',       ic:'¶',  nm:'本文',                 ph:'「/」でコマンド / テキスト', cat:'基本'},
    {t:'title',   ic:'T',  nm:'作品タイトル',          ph:'作品タイトル'},
    {t:'tagline', ic:'×',  nm:'タグライン',            ph:'要素 × 要素'},
    {t:'h1',      ic:'H1', nm:'見出し1',               ph:'見出し1', cat:'見出し'},
    {t:'h2',      ic:'H2', nm:'見出し2',               ph:'見出し2'},
    {t:'h3',      ic:'H3', nm:'見出し3',               ph:'見出し3'},
    {t:'h4',      ic:'H4', nm:'見出し4',               ph:'見出し4'},
    {t:'h5',      ic:'H5', nm:'見出し5',               ph:'見出し5'},
    {t:'toggle',  ic:'▸',  nm:'トグル',               ph:'トグル', cat:'トグル', ctn:1},
    {t:'th1',     ic:'▸1', nm:'トグル見出し1',         ph:'トグル見出し1', ctn:1},
    {t:'th2',     ic:'▸2', nm:'トグル見出し2',         ph:'トグル見出し2', ctn:1},
    {t:'th3',     ic:'▸3', nm:'トグル見出し3',         ph:'トグル見出し3', ctn:1},
    {t:'th4',     ic:'▸4', nm:'トグル見出し4',         ph:'トグル見出し4', ctn:1},

  function onKey(e,be,b){

  }
  function setRowUl(c){ if(!focusedId) return; var ci=ctx(focusedId); if(!ci) return; ci.b.ul=c||''; var be=doc.querySelector('.block[data-id="'+focusedId+'"] .be'); if(be) be.style.borderBottom=c?('2px solid '+c):''; persist(); }

  function hexRgba(hex,a){ hex=(hex||'').replace('#',''); if(hex.length===3){hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];} var r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16); return 'rgba('+r+','+g+','+b+','+a+')'; }
  var QUICK_TEXT=['#000000','#ffffff','#666666','#ff0000','#0000ff','#22a022','#f1c40f'];
  var QUICK_MARK=QUICK_TEXT.map(function(c){return hexRgba(c,0.5);});
  var QUICK_ROW =QUICK_TEXT.slice();
  var QUICK_UL  =QUICK_TEXT.slice();
  function makeColorGroup(hostId,quick,onColor,onClear,initial){
    var host=document.getElementById(hostId); if(!host) return;
    var ci=document.createElement('input'); ci.type='color'; ci.className='ci'; ci.value=initial||'#000000';
    var hx=document.createElement('input'); hx.type='text'; hx.className='hex'; hx.placeholder='#rrggbb'; hx.value='';
    ci.oninput=function(){ hx.value=ci.value; };
    ci.onchange=function(){ onColor(ci.value); };
    function applyHex(){ var n=normHex(hx.value); if(n){ ci.value=n; hx.value=n; onColor(n); } }
    hx.onmousedown=function(e){ e.stopPropagation(); };
    hx.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); applyHex(); } };
    hx.onchange=applyHex;
    host.appendChild(ci); host.appendChild(hx);
    quick.forEach(function(c){ var b=document.createElement('button'); b.className='mini'; b.style.background=c; b.title=c;
      b.onmousedown=function(e){e.preventDefault();}; b.onclick=function(){ ci.value=c; hx.value=c; onColor(c); }; host.appendChild(b); });
    if(onClear){ var cl=document.createElement('button'); cl.className='clr'; cl.textContent='なし';
      cl.onmousedown=function(e){e.preventDefault();}; cl.onclick=function(){ hx.value=''; onClear(); }; host.appendChild(cl); }
  }
  function buildPalettes(){
    var ps=document.getElementById('palStyle');
    if(ps) ps.querySelectorAll('button[data-cmd]').forEach(function(b){ b.onmousedown=function(e){e.preventDefault();}; b.onclick=function(){ applyCmd(b.dataset.cmd); }; });
    makeColorGroup('palText',QUICK_TEXT,function(c){applyInline('fore',c);},function(){applyInline('fore','');},'#000000');
    makeColorGroup('palMark',QUICK_MARK,function(c){applyInline('mark',c);},function(){applyInline('mark','');},'#ffff00');
    makeColorGroup('palRow', QUICK_ROW, function(c){setRowBg(c);},       function(){setRowBg('');},       '#000000');
    makeColorGroup('palUl',  QUICK_UL,  function(c){setRowUl(c);},       function(){setRowUl('');},       '#000000');
  }

  /* ---- しおり（アウトライン） ---- */
  var outlineEl=document.getElementById('outline');
  var HL={h1:1,h2:2,h3:3,h4:4,h5:5,th1:1,th2:2,th3:3,th4:4,th5:5};
  function plainText(html){ var d=document.createElement('div'); d.innerHTML=html||''; return (d.textContent||'').trim(); }
  function outlineItems(){
    var items=[];
    (function walk(arr){ arr.forEach(function(b){ if(HL[b.type]) items.push({id:b.id,lv:HL[b.type],t:plainText(b.html)}); if(b.children) walk(b.children); }); })(state.blocks);
    return items;
  }
  function outlineInnerHTML(items){
    var h='<div class="ol-ttl">しおり<button class="ol-x" id="olX" title="閉じる">×</button></div>';
    if(!items.length){ h+='<div class="ol-empty">見出しがありません</div>'; }
    else items.forEach(function(it){ h+='<a class="lv'+it.lv+'" data-goto="'+it.id+'">'+esc(it.t||'(無題)')+'</a>'; });
    return h;
  }
  function renderOutline(){
    var items=outlineItems();
    outlineEl.innerHTML=outlineInnerHTML(items);
    var pt=document.getElementById('printToc');
    if(pt){ var p=''; if(items.length){ p='<div class="pt-h">しおり</div>'; items.forEach(function(it){ p+='<div class="pt-i lv'+it.lv+'">'+esc(it.t||'(無題)')+'</div>'; }); } pt.innerHTML=p; }
  }
  function applyOutline(){ outlineEl.classList.toggle('open',!!state.outlineOpen); document.body.classList.toggle('ol-open',!!state.outlineOpen); }
  function expandTo(id){
    var chain=[], cur=id, guard=0;
    while(guard++<50){ var c=ctx(cur); if(!c||!c.parent) break; chain.push(c.parent); cur=c.parent.id; }
    var changed=false; chain.forEach(function(b){ if(b.collapsed){ b.collapsed=false; changed=true; } });
    if(changed) render();
  }
  outlineEl.addEventListener('click',function(e){
    if(e.target.id==='olX'){ state.outlineOpen=false; applyOutline(); persist(); return; }
    var a=e.target.closest('a[data-goto]'); if(!a) return;
    var id=a.dataset.goto; expandTo(id);
    var el=doc.querySelector('.block[data-id="'+id+'"]'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  });
  document.getElementById('btnOutline').onclick=function(){ state.outlineOpen=!state.outlineOpen; applyOutline(); persist(); };

  /* ---- テーマ / 文字サイズ ---- */
  function applyTheme(){ root.setAttribute('data-theme',state.theme); document.getElementById('btnTheme').textContent=state.theme==='dark'?'☀ ライト':'🌙 ダーク'; }
  var FS={sm:0.8,md:1};
  function applyFs(){ document.querySelector('.wrap').style.setProperty('--fs',FS[state.fs]); document.querySelectorAll('#segFs button').forEach(function(x){x.classList.toggle('on',x.dataset.fs===state.fs);}); }
  document.getElementById('segFs').addEventListener('click',function(e){ var b=e.target.closest('button[data-fs]'); if(b){ state.fs=b.dataset.fs; applyFs(); persist(); } });
  document.getElementById('btnTheme').onclick=function(){ state.theme=state.theme==='dark'?'light':'dark'; applyTheme(); persist(); };

  /* ---- ファイル管理（複数シナリオ） ---- */
  var fileOvl=document.getElementById('fileOvl');
  function renderFileList(){
    var idx=readIndex().slice().sort(function(a,b){return (b.updated||0)-(a.updated||0);});
    var el=document.getElementById('fList');
    if(!idx.length){ el.innerHTML='<div class="fhint">保存されたシナリオはありません</div>'; return; }
    el.innerHTML=idx.map(function(x){
      var cur=x.id===state.id?' cur':''; var dt=x.updated?new Date(x.updated):null;
      var dts=dt?((dt.getMonth()+1)+'/'+dt.getDate()+' '+pad(dt.getHours())+':'+pad(dt.getMinutes())):'';
      return '<div class="fitem'+cur+'"><span class="fnm" data-open="'+x.id+'">'+esc(x.name)+(cur?' ✓':'')+'</span><span class="fdt">'+dts+'</span><button data-del="'+x.id+'">削除</button></div>';
    }).join('');
  }
  function openFileDlg(){ document.getElementById('fName').value=state.name; document.getElementById('fHint').textContent='現在のシナリオ：'+state.name; renderFileList(); fileOvl.classList.add('show'); }
  document.getElementById('btnFile').onclick=openFileDlg;
  document.getElementById('fClose').onclick=function(){ fileOvl.classList.remove('show'); };
  fileOvl.onclick=function(e){ if(e.target===fileOvl) fileOvl.classList.remove('show'); };
  document.getElementById('fSave').onclick=function(){
    var nm=document.getElementById('fName').value.trim()||'無題のシナリオ';
    state.name=nm; persist(); updateDocName(); renderFileList();
    document.getElementById('fHint').textContent='保存しました：'+nm;
  };
  document.getElementById('fNew').onclick=function(){
    newDoc('無題のシナリオ'); document.getElementById('fName').value=state.name; renderFileList();
    document.getElementById('fHint').textContent='新規シナリオを作成しました';
  };
  document.getElementById('fList').addEventListener('click',function(e){
    var op=e.target.getAttribute('data-open');
    if(op){ openDoc(op); document.getElementById('fName').value=state.name; renderFileList(); document.getElementById('fHint').textContent='開きました：'+state.name; return; }
    var dl=e.target.getAttribute('data-del');
    if(dl){ if(confirm('このシナリオを削除しますか？（元に戻せません）')){ deleteDoc(dl); document.getElementById('fName').value=state.name; renderFileList(); } }
  });

  /* ---- 書き出し（HTML / PDF） ---- */
  function staticBlockHTML(b){
    var style=b.bg?(' style="background:'+esc(b.bg)+'"'):'';
    var us=b.ul?(' style="border-bottom:2px solid '+esc(b.ul)+'"'):'';
    if(b.type==='divider') return '<div class="block" data-type="divider"><hr></div>';
    if(isCallout(b.type)) return '<div class="block" data-type="'+b.type+'"'+style+'><div class="be lbl">'+(b.html||'')+'</div><div class="children">'+(b.children||[]).map(staticBlockHTML).join('')+'</div></div>';
    if(isCtn(b.type)) return '<div class="block'+(b.collapsed?' collapsed':'')+'" data-type="'+b.type+'"><div class="chead"><span class="tri">▼</span><div class="be"'+us+'>'+(b.html||'')+'</div></div><div class="children">'+(b.children||[]).map(staticBlockHTML).join('')+'</div></div>';
    var done=(b.type==='todo'&&b.done)?' done':''; var tick=(b.type==='todo')?'<div class="tick"></div>':'';
    return '<div class="block'+done+'" data-type="'+b.type+'"'+style+'>'+tick+'<div class="be"'+us+'>'+(b.html||'')+'</div></div>';
  }
  function exportHTML(){
    var css=document.querySelector('style').textContent;
    var items=outlineItems();
    var olHTML=outlineInnerHTML(items);
    var fsSm=(state.fs==='sm'?' class="on"':''), fsMd=(state.fs==='md'?' class="on"':'');
    var themeLabel=(state.theme==='dark'?'☀ ライト':'🌙 ダーク');
    var vhead='<div class="v-head">'
      +'<button class="hbtn" id="vOutline">☰ しおり</button>'
      +'<span class="v-title">'+esc(state.name)+'</span>'
      +'<span class="v-sp"></span>'
      +'<div class="seg" id="vFs"><button data-fs="sm"'+fsSm+'>小</button><button data-fs="md"'+fsMd+'>中</button></div>'
      +'<button class="hbtn" id="vTheme">'+themeLabel+'</button></div>';
    var nav='<nav class="outline open" id="vOutlineNav">'+olHTML+'</nav>';
    var ptHTML='<div class="print-toc">'+(items.length?('<div class="pt-h">しおり</div>'+items.map(function(it){return '<div class="pt-i lv'+it.lv+'">'+esc(it.t||'(無題)')+'</div>';}).join('')):'')+'</div>';
    var body='<div class="wrap" style="--fs:'+FS[state.fs]+'">'+ptHTML+'<div class="doc">'+state.blocks.map(staticBlockHTML).join('')+'</div></div>';
    var vcss=' .v-head{position:fixed;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:10px;'
      +'padding:0 16px;background:var(--header-bg);color:var(--header-text);z-index:100}'
      +' .v-head .v-title{font-weight:700;letter-spacing:.04em;font-size:14px;color:var(--header-text);'
      +'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}'
      +' .v-head .v-sp{margin-left:auto}'
      +' body>.wrap{padding-top:66px}'
      +' @media print{.v-head,.outline{display:none!important} body>.wrap{padding-top:0}}';
    var vjs='<'+'script>(function(){var root=document.documentElement,nav=document.getElementById("vOutlineNav"),wrap=document.querySelector(".wrap");'
      +'function setOpen(o){nav.classList.toggle("open",o);document.body.classList.toggle("ol-open",o);}'
      +'document.getElementById("vOutline").onclick=function(){setOpen(!nav.classList.contains("open"));};'
      +'nav.addEventListener("click",function(e){if(e.target.id==="olX"){setOpen(false);return;}var a=e.target.closest("a[data-goto]");if(a){var el=document.querySelector(\'.block[data-id="\'+a.dataset.goto+\'"]\');if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}});'
      +'var FS={sm:0.8,md:1};document.querySelectorAll("#vFs button").forEach(function(b){b.onclick=function(){wrap.style.setProperty("--fs",FS[b.dataset.fs]);document.querySelectorAll("#vFs button").forEach(function(x){x.classList.toggle("on",x===b);});};});'
      +'document.getElementById("vTheme").onclick=function(){var d=root.getAttribute("data-theme")==="dark";root.setAttribute("data-theme",d?"light":"dark");this.textContent=d?"🌙 ダーク":"☀ ライト";};'
      +'document.addEventListener("click",function(e){var tri=e.target.closest(".tri");if(tri){var blk=tri.closest(".block");if(blk)blk.classList.toggle("collapsed");}});'
      +'})();<\/script>';
    var html='<!DOCTYPE html><html lang="ja" data-theme="'+state.theme+'"><head><meta charset="UTF-8">'
      +'<meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(state.name)+'</title>'
      +'<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho+B1:wght@600;700;800&display=swap" rel="stylesheet">'
      +'<style>'+css+' .head,.fbar,.menu,.ovl{display:none!important}'+vcss+'</style></head>'
      +'<body class="ol-open">'+vhead+nav+body+vjs+'</body></html>';
    var blob=new Blob([html],{type:'text/html'}); var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=(state.name||'scenario')+'.html'; a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  }
  document.getElementById('btnHtml').onclick=exportHTML;
  document.getElementById('btnPdf').onclick=function(){ window.print(); };

  /* ---- 初期化 ---- */
  if(!load()){
    var sk=newBlock('skill','＜目星＞');
    sk.children=[ newBlock('toggle','成功情報'), newBlock('toggle','失敗情報') ];
    sk.children[0].children=[ newBlock('p','成功時の描写をここに。') ];
    sk.children[1].children=[ newBlock('p','失敗時の描写をここに。') ];
    var kp=newBlock('kp','KP情報');
    kp.children=[ newBlock('p','ここにKPのみ知る情報。塗りつぶしの枠に白抜きで表示されます。') ];
    var pl=newBlock('info','PL情報');
    pl.children=[ newBlock('p','PLに公開する情報。左端だけ黒のライト枠です。') ];
    state.id=docId(); state.name='サンプルシナリオ';
    state.blocks=[
      newBlock('title','天泣の吟'),
      newBlock('tagline','雨 × 煙草 × 未亡人'),
      newBlock('h1','あらすじ'),
      newBlock('p','寒い冬の日――世間は一週間、雨の予報が続いていた。'),
      newBlock('h1','本編'),
      sk, kp, pl,
      newBlock('p','')
    ];
    persist();
  }
  buildPalettes();
  (function(){ var fb=document.getElementById('fbar'), tg=document.getElementById('fbarToggle'); if(tg) tg.onclick=function(){ fb.classList.toggle('open'); }; })();
  render(); applyOutline(); updateDocName(); saveInd.textContent='自動保存 有効';

  window.__ed={ state:state, TYPES:TYPES, newBlock:newBlock, render:render, persist:persist, load:load,
    IDX:IDX, DOCP:DOCP, CUR:CUR, readIndex:readIndex, openDoc:openDoc, newDoc:newDoc, deleteDoc:deleteDoc,
    ctx:ctx, sanitize:sanitize, isCtn:isCtn, isCallout:isCallout, exportHTML:exportHTML,
    staticBlockHTML:staticBlockHTML, setRowUl:setRowUl,
    menuItems:function(f){ menuMode='slash'; buildMenuItems(f); return menu.innerHTML; },
    getState:function(){return state;},
    applyFs:applyFs, applyTheme:applyTheme, renderOutline:renderOutline, applyOutline:applyOutline };
})();
</script>
</body>
</html>
