<style>
  :root{
    --fs:1;
    --bg:#ffffff; --card:#ffffff; --box:#f4f1ea; --line:#e4ded2;
    --text:#2b2724; --muted:#8a8175; --accent:#5b5348; --accent2:#8c8375;
    --red:#8b0000; --blue:#0000ff;
    --kp-bg:#3a3a3a; --kp-text:#f2f0ec; --pl-edge:#1e1e1e; --secret:#8b0000;
    --hover:#f0ece3; --sel:#2f6feb; --sel-fg:#ffffff;
    --header-bg:#2b2724; --header-text:#f6f2ea;
    --page-h:1043px; --page-line:rgba(37,99,235,.7);
  }
  html[data-theme="dark"]{
    --bg:#1b1916; --card:#26231f; --box:#302c26; --line:#3c372f;
    --text:#ece7df; --muted:#a89e90; --accent:#cabfae; --accent2:#9a8f7e;
    --red:#e0685c; --blue:#7f9bff;
    --kp-bg:#3a352e; --kp-text:#efe9df; --pl-edge:#0b0b0b; --secret:#cf5b52;
    --hover:#332e28; --sel:#4b83ff; --sel-fg:#ffffff;
    --header-bg:#100e0c; --header-text:#f2ede4;
    --page-h:1043px; --page-line:rgba(96,165,250,.75);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--sel);color:var(--sel-fg)}
  ::-moz-selection{background:var(--sel);color:var(--sel-fg)}

  /* ── header ── */
  .head{position:sticky;top:0;z-index:100;background:var(--header-bg)}
  .head-in{max-width:920px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative}
  .htitle{font-size:15px;font-weight:800;color:var(--header-text);letter-spacing:.3em;font-family:Arial,Helvetica,sans-serif}
  .save-ind{font-size:11.5px;color:rgba(255,255,255,.5);letter-spacing:.05em;min-width:118px}
  .head .sp{margin-left:auto}
  .hmenu{position:absolute;top:46px;right:8px;width:250px;background:var(--card);color:var(--text);
    border:1px solid var(--line);border-radius:11px;box-shadow:0 14px 36px rgba(0,0,0,.28);padding:8px;display:none;z-index:200}
  .hmenu.show{display:block}
  .hm-sec{font-size:10px;letter-spacing:.14em;color:var(--muted);padding:9px 8px 3px}
  .hm-item{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:7px;
    padding:9px 10px;cursor:pointer;color:var(--text);font-size:13px}
  .hm-item:hover{background:var(--hover)}
  .hm-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;font-size:12.5px}
  .hm-row #acctLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seg2{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
  .seg2 button{font-family:inherit;font-size:12.5px;color:var(--text);background:transparent;border:0;padding:5px 12px;cursor:pointer}
  .seg2 button.on{background:var(--accent);color:var(--card);font-weight:700}
  .seg2 button+button{border-left:1px solid var(--line)}
  .hm-select{width:100%;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--text);font-family:inherit;font-size:13px;padding:0 8px;cursor:pointer}
  .hm-check{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12.5px;color:var(--text)}
  .hm-check input{cursor:pointer}
  .hbtn{font-family:inherit;font-size:12.5px;color:#eee;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);border-radius:7px;padding:6px 11px;cursor:pointer;transition:.14s}
  .hbtn:hover{background:rgba(255,255,255,.18)}
  .hbtn.ico{padding:6px 9px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1}
  .hbtn.ico svg{display:block}
  .seg{display:inline-flex;border:1px solid rgba(255,255,255,.16);border-radius:7px;overflow:hidden}
  .seg button{font-family:inherit;font-size:12.5px;color:#eee;background:transparent;border:0;padding:6px 12px;cursor:pointer}
  .seg button.on{background:rgba(255,255,255,.2);font-weight:700}
  .seg button+button{border-left:1px solid rgba(255,255,255,.16)}

  /* ── format bar ── */
  .fbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:var(--head-h,44px);z-index:95}
  .fbar-in{max-width:none;width:100%;margin:0;padding:6px 16px;display:flex;flex-direction:column;gap:7px}
  .fbrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .fcell{display:flex;align-items:center;gap:6px}
  .fgroup-fa{display:contents}
  .fbar-toggle{display:none}
  .fbar-ins{display:none}
  .fbar-bar{display:flex;align-items:center;gap:8px}
  .fbar .lb{font-size:11px;color:var(--muted);letter-spacing:.06em;white-space:nowrap;flex:none;display:inline-block;width:4.4em;box-sizing:border-box}
  .fbar .sepline{width:1px;height:18px;background:var(--line);flex:none}
  .fbar .fb{width:26px;height:24px;border:1px solid var(--line);border-radius:5px;background:var(--bg);
    color:var(--text);cursor:pointer;font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  .fbar .fb:hover{background:var(--hover)}
  .ulstyle{display:inline-flex;gap:2px;margin-left:4px}
  .ulstyle button{width:22px;height:22px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--text);cursor:pointer;font-size:12px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  .ulstyle button:hover{background:var(--hover)}
  .ulstyle button.on{background:var(--red);color:#fff;border-color:var(--red)}
  .fbar .fb#btnFsDown,.fbar .fb#btnFsUp{font-size:10px;letter-spacing:-.02em}
  .fbar .fb:disabled{opacity:.3;cursor:default}
  .fb-select{height:26px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit;font-size:12px;padding:0 6px;max-width:120px;cursor:pointer}
  .grp{flex:none}
  .sw{width:20px;height:20px;border-radius:5px;border:1px solid var(--line);cursor:pointer;padding:0;position:relative}
  .sw:hover{transform:scale(1.1)}
  .sw.none::after{content:"╱";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
  .grp{display:inline-flex;align-items:center;gap:5px}
  input.ci{-webkit-appearance:none;-moz-appearance:none;appearance:none;box-sizing:border-box;flex:none;
    width:34px;height:20px;border:1px solid var(--line);border-radius:4px;padding:0;background:var(--card);
    cursor:pointer;vertical-align:middle;overflow:hidden}
  input.ci::-webkit-color-swatch-wrapper{padding:0}
  input.ci::-webkit-color-swatch{border:0;border-radius:3px}
  input.ci::-moz-color-swatch{border:0;border-radius:3px}
  .grp .mini{width:16px;height:16px;border-radius:4px;border:1px solid var(--line);cursor:pointer;padding:0}
  .grp .mini:hover{transform:scale(1.12)}
  .grp .clr{font-size:14px;line-height:1;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:5px;padding:3px 6px;cursor:pointer}
  .grp .clr:hover{background:var(--hover);color:var(--text)}

  /* ── page ── */
  .wrap{position:relative;width:794px;max-width:100%;margin:0 auto;padding:40px 40px 45vh;font-size:calc(16px * var(--fs));font-family:var(--doc-font,"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif)}
  #pageOverlay{position:absolute;left:0;right:0;top:0;pointer-events:none;z-index:1}
  #pageOverlay .page-line{position:absolute;left:40px;right:40px;border-top:1px dashed var(--page-line)}
  #pageOverlay .page-line span{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:6px;white-space:nowrap;font-size:10px;line-height:1;color:var(--page-line);font-family:sans-serif}

  /* ── block ── */
  .block{position:relative;margin:1px 0;border-radius:5px;scroll-margin-top:calc(var(--topbar-h,92px) + 8px)}
  .block.has-bg{padding-top:.35em;padding-bottom:.35em;padding-left:12px;padding-right:12px;margin-top:8px;margin-bottom:8px}
  .block.has-bg>.be{min-height:0!important;margin-top:0!important;margin-bottom:0!important}
  .block>.gutter{position:absolute;left:-52px;top:2px;display:flex;gap:2px;opacity:0;transition:.12s;height:1.7em;align-items:center}
  .block:hover>.gutter,.block:focus-within>.gutter{opacity:1}
  .gutter button{width:20px;height:20px;border:0;background:transparent;color:var(--muted);
    border-radius:5px;cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
  .gutter button:hover{background:var(--hover);color:var(--text)}
  .grip{cursor:grab}
  .block:hover>.gutter .grip,.block:focus-within>.gutter .grip{background:var(--hover);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
  .grip:hover{background:var(--red)!important;color:#fff!important;box-shadow:none!important}
  .grip:active{cursor:grabbing}
  .block.drag-over{box-shadow:0 -2px 0 var(--red)}
  .colcell.drag-over{box-shadow:inset 0 0 0 2px var(--red);border-radius:6px}
  .block.dragging{opacity:.4}

  .be{outline:0;white-space:pre-wrap;word-break:break-word;min-height:1.6em;padding:0 2px}
  #doc,#doc:focus,#doc:focus-visible{outline:none}
  .doc-img{float:left;max-width:46%;height:auto;margin:3px 16px 8px 0;border-radius:6px;border:1px solid var(--line)}
  #imgRz{position:fixed;width:14px;height:14px;background:var(--red);border:2px solid #fff;border-radius:3px;cursor:nwse-resize;z-index:9998;box-shadow:0 1px 4px rgba(0,0,0,.4);display:none}
  .be:has(img.doc-img){display:flow-root}
  .cols-row{display:flex;gap:24px;align-items:flex-start;margin:2px 0}
  .cols-row.edit{gap:0}
  .col-resize{flex:0 0 22px;align-self:stretch;min-height:1.8em;cursor:col-resize;position:relative;touch-action:none}
  .col-resize::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;border-radius:2px;background:transparent;transition:background .12s}
  .cols-row.colline .col-resize::before{background:var(--line)}
  .cols-row.colline>.colcell + .colcell{border-left:1px solid var(--line)}
  .col-resize::after{content:"";position:absolute;left:5px;top:50%;transform:translateY(-50%);width:12px;height:36px;border-radius:6px;background:var(--muted);opacity:0;transition:opacity .12s,background .12s}
  .col-resize:hover::before,.col-resize.rz::before{background:var(--red)}
  .col-resize:hover::after,.col-resize.rz::after{opacity:.95;background:var(--red)}
  .colcell{flex:1 1 0;min-width:0}
  .pdf-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999}
  .pdf-ov-box{background:#fff;color:#111;padding:18px 26px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 10px 34px rgba(0,0,0,.35)}
  .colcell>.block:first-child{margin-top:0}
  .colcell>.block:first-child .be{margin-top:0}
  .colcell>.block:first-child>.chead .be{margin-top:0}
  .colcell .block>.gutter{left:-30px}
  .col-add{display:block;width:100%;margin-top:2px;font-size:11.5px;color:var(--muted);background:transparent;border:1px dashed var(--line);border-radius:6px;cursor:pointer;padding:4px;text-align:center}
  .col-add:hover{background:var(--hover);color:var(--text)}
  .be:empty::before{content:attr(data-ph);color:var(--muted);opacity:.6;pointer-events:none}

  .block[data-type="p"]{padding:1px 0}
  .block[data-type="title"] .be{font-family:var(--doc-font,"Zen Kaku Gothic New",sans-serif);font-size:2.8em;font-weight:800;text-align:center;letter-spacing:.06em;line-height:1.2;margin:6px 0 2px}
  .block[data-type="tagline"] .be{text-align:center;color:var(--muted);letter-spacing:.16em;font-size:.98em}
  .block[data-type="h1"] .be{font-weight:800;font-size:1.8em;color:var(--text);letter-spacing:.03em;line-height:1.35;margin:26px 0 12px}
  .block[data-type="h2"] .be{font-weight:800;font-size:1.5em;margin:24px 0 10px}
  .block[data-type="h3"] .be{font-weight:700;font-size:1.28em;color:var(--accent);margin:20px 0 6px}
  .block[data-type="h4"] .be{font-weight:700;font-size:1.12em;color:var(--accent);margin:16px 0 5px}
  .block[data-type="h5"] .be{font-weight:700;font-size:1em;color:var(--muted);margin:14px 0 4px}
  .block[data-type="ev"] .be::before,.block[data-type="evr"] .be::before{content:"！";display:inline-block;color:#e5352b;font-weight:800;margin-right:1px;text-decoration:none}
  .block[data-type="ev"] .be,.block[data-type="evr"] .be{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-weight:800;color:var(--text);font-size:1.02em;letter-spacing:.02em;margin:14px 0 5px}
  .block[data-type="ev"] .be{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
  .block[data-type="evr"] .be{border-bottom:1px solid var(--text);padding-bottom:3px}
  .block[data-type="q"] .be::before{content:"Q.";display:inline-block;margin-right:3px;font-weight:700}
  .block[data-type="q"] .be{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-weight:700;color:#2383c7}
  .block[data-type="quote"] .be{border-left:3px solid var(--accent2);padding-left:14px;color:var(--accent)}
  .block[data-type="bullet"]{padding-left:20px}
  .block[data-type="bullet"]>.be::before{content:"•";position:absolute;left:4px;color:var(--red)}
  .block[data-type="bullet"]>.be{position:static}
  .block[data-type="bullet"]{position:relative}
  .block[data-type="todo"]{padding-left:24px;position:relative}
  .block[data-type="todo"]>.tick{position:absolute;left:2px;top:.28em;width:15px;height:15px;border:1.5px solid var(--accent2);border-radius:3px;cursor:pointer;background:var(--card)}
  .block[data-type="todo"].done>.tick{background:var(--red);border-color:var(--red)}
  .block[data-type="todo"].done>.tick::after{content:"✓";color:#fff;font-size:11px;position:absolute;left:2px;top:-3px}
  .block[data-type="todo"].done>.be{color:var(--muted);text-decoration:line-through}
  .block[data-type="divider"]{padding:9px 0}
  .block[data-type="divider"] hr{border:0;border-top:1px solid var(--line);margin:0}

  /* container (toggle / toggle-heading / callout) */
  .chead{display:flex;align-items:center;gap:4px}
  .hlink{color:var(--blue);text-decoration:underline;cursor:pointer}
  .tri{flex:none;width:22px;height:1.5em;border:0;background:transparent;cursor:pointer;color:var(--accent2);font-size:calc(16px * var(--fs) - 1px);line-height:1;display:flex;align-items:center;justify-content:center;transition:transform .12s}
  .block.collapsed>.chead .tri{transform:rotate(-90deg)}
  .chead .be{flex:1}
  .children{margin:3px 0 4px 20px;border-left:1px solid var(--line);padding-left:12px}
  .block.collapsed>.children{display:none}
  .addchild{font-size:11.5px;color:var(--muted);background:transparent;border:0;cursor:pointer;padding:3px 4px;border-radius:5px}
  .addchild:hover{background:var(--hover);color:var(--text)}

  .block[data-type="toggle"]>.chead .be{font-weight:500}
  .block[data-type="th1"]>.chead .be{font-weight:800;font-size:1.7em}
  .block[data-type="th2"]>.chead .be{font-weight:800;font-size:1.45em}
  .block[data-type="th3"]>.chead .be{font-weight:700;font-size:1.25em}
  .block[data-type="th4"]>.chead .be{font-weight:700;font-size:1.1em}
  .block[data-type="th5"]>.chead .be{font-weight:700;font-size:1em;color:var(--muted)}

  /* callout（KP情報 / PL情報 / 技能情報）：左上バッジ + 本文 */
  .block[data-type="kp"],.block[data-type="info"],.block[data-type="skill"],.block[data-type="secret"]{
    position:relative;border-radius:7px;padding:13px 14px 9px;margin:17px 0 10px}
  .block[data-type="kp"] .lbl,.block[data-type="info"] .lbl,.block[data-type="skill"] .lbl,.block[data-type="secret"] .lbl{
    position:absolute;top:-10px;left:8px;min-height:0;font-weight:700;font-size:0.82em;
    letter-spacing:.08em;line-height:1.3;padding:2px 10px;border-radius:4px}
  .block[data-type="info"] .lbl,.block[data-type="skill"] .lbl,.block[data-type="secret"] .lbl{font-size:0.98em;top:-12px}
  .block[data-type="kp"] .lbl:empty::before,.block[data-type="info"] .lbl:empty::before,.block[data-type="skill"] .lbl:empty::before,.block[data-type="secret"] .lbl:empty::before{opacity:.85}
  .block[data-type="kp"]>.children,.block[data-type="info"]>.children,.block[data-type="skill"]>.children,.block[data-type="secret"]>.children{
    margin:0;border-left:0;padding-left:0}

  /* KP情報：塗りつぶしのダーク枠・白抜き文字 */
  .block[data-type="kp"]{background:var(--kp-bg);color:var(--kp-text)}
  .block[data-type="kp"]>.children,.block[data-type="kp"]>.children .be{font-family:"UD デジタル 教科書体 NK-R","UD Digital Kyokasho NK-R","UDデジタル教科書体 NK-R",var(--doc-font),sans-serif}
  .block[data-type="kp"]>.children .be{line-height:1.45;min-height:1.3em}
  .block[data-type="kp"]>.children>.block{margin:0}
  .block[data-type="kp"] .be{color:var(--kp-text)}
  .block[data-type="kp"] .lbl{background:var(--kp-bg);color:var(--kp-text);border:1px solid rgba(255,255,255,.22);font-family:"UD デジタル 教科書体 NK-R","UD Digital Kyokasho NK-R","UDデジタル教科書体 NK-R",var(--doc-font),sans-serif}
  .block[data-type="kp"] .addchild{color:rgba(255,255,255,.55)}
  .block[data-type="kp"] .addchild:hover{background:rgba(255,255,255,.12);color:#fff}

  /* PL情報：ライト枠・左端だけ黒 */
  .block[data-type="info"]{background:var(--card);border:1px solid var(--pl-edge);border-left-width:4px}
  .block[data-type="info"] .lbl{background:var(--pl-edge);color:#fff}

  /* NPCセリフ：四角（角丸なし）・見出しバッジを左端に完全に寄せる */
  .block[data-type="npc"]{position:relative;background:var(--card);border:1.5px solid var(--pl-edge);border-radius:0;padding:16px 14px 10px;margin:19px 0 10px}
  .block[data-type="npc"] .lbl{position:absolute;top:-13px;left:-1.5px;min-height:0;font-weight:700;font-size:0.98em;letter-spacing:.08em;line-height:1.3;padding:2px 12px;border-radius:0;background:var(--pl-edge);color:#fff;font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
  .block[data-type="npc"]>.children{margin:0;border-left:0;padding-left:0}

  /* 情報ボックス（任意色・boxcで背景指定） */
  .block[data-type="cbox"]{position:relative;border-radius:7px;padding:13px 14px 9px;margin:17px 0 10px;border:1px solid var(--line)}
  .block[data-type="cbox"] .lbl{position:absolute;top:-12px;left:8px;min-height:0;font-weight:700;font-size:0.98em;letter-spacing:.08em;line-height:1.3;padding:2px 10px;border-radius:4px;background:var(--card);border:1px solid var(--line)}
  .block[data-type="cbox"]>.children{margin:0;border-left:0;padding-left:0}

  /* 情報ボックス（白地・枠色変更可） */
  .block[data-type="cbox2"]{position:relative;background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:7px;padding:13px 14px 9px;margin:17px 0 10px}
  .block[data-type="cbox2"] .lbl{position:absolute;top:-12px;left:8px;min-height:0;font-weight:700;font-size:0.98em;letter-spacing:.08em;line-height:1.3;padding:2px 10px;border-radius:4px;color:#fff}
  .block[data-type="cbox2"]>.children{margin:0;border-left:0;padding-left:0}

  /* 技能情報：ライト枠・左端と見出しだけ青 */
  .block[data-type="skill"]{background:var(--card);border:1px solid var(--blue);border-left-width:4px}
  .block[data-type="skill"] .lbl{background:var(--blue);color:#fff;font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}

  /* 秘匿情報：白背景・落ち着いた赤の枠と見出し */
  .block[data-type="secret"]{background:var(--card);border:1px solid var(--secret);border-left-width:4px}
  .block[data-type="secret"] .lbl{background:var(--secret);color:#fff}
  .block[data-type="info"] .lbl,.block[data-type="secret"] .lbl,.block[data-type="cbox"] .lbl,.block[data-type="cbox2"] .lbl{font-family:"Yu Mincho Demibold","游明朝 Demibold","YuMincho Demibold","YuMincho-Demibold","Yu Mincho","游明朝",serif}
  .block[data-type="kp"] .lbl,.block[data-type="info"] .lbl,.block[data-type="skill"] .lbl,.block[data-type="secret"] .lbl,.block[data-type="cbox"] .lbl,.block[data-type="cbox2"] .lbl{display:inline-flex;align-items:center;line-height:1.15}
  /* 情報枠②：見出しは枠外（上）、本文だけを左＋下の細い罫線で囲む */
  .block[data-type="lbox"]{border:0;background:transparent;border-radius:0;padding:0;margin:14px 0}
  .block[data-type="lbox"]>.lbl{position:static;display:block;background:transparent;border:0;color:var(--text);font-weight:400;font-size:1.05em;letter-spacing:.02em;padding:0;margin:0 0 3px;border-radius:0;min-height:0;font-family:"Yu Mincho Demibold","游明朝 Demibold","YuMincho Demibold","YuMincho-Demibold","Yu Mincho","游明朝",serif}
  .block[data-type="lbox"]>.lbl::before{content:"▼";display:inline-block;margin-right:5px}
  .block[data-type="lbox"]>.children{border-left:1px solid var(--text);border-bottom:1px solid var(--text);border-radius:0;padding:4px 6px 12px 12px;margin:0}
  /* ■探索箇所＜＞ */
  .block[data-type="explore"] .be::before{content:"■探索箇所＜";display:inline-block}
  .block[data-type="explore"] .be::after{content:"＞";display:inline-block}
  .block[data-type="explore"] .be{font-family:"Yu Mincho Demibold","游明朝 Demibold","YuMincho Demibold","YuMincho-Demibold","Yu Mincho","游明朝",serif;font-weight:600;margin:12px 0 4px}

  /* ── menu ── */
  .menu{position:absolute;z-index:200;width:264px;max-height:340px;overflow:auto;background:var(--card);
    border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.22);padding:6px;display:none}
  .menu.show{display:block}
  .menu .mcat{font-size:10px;letter-spacing:.14em;color:var(--muted);padding:7px 10px 3px}
  .menu .mcat-pg{color:var(--text);font-weight:700;border-top:1px solid var(--line);margin-top:3px}
  .menu .macc-h{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:11px;letter-spacing:.1em;color:var(--muted);cursor:pointer;user-select:none;border-radius:6px}
  .menu .macc-h:hover{background:var(--hover);color:var(--text)}
  .menu .macc-h .tw{display:inline-block;transition:transform .12s}
  .menu .macc.open .macc-h .tw{transform:rotate(90deg)}
  .menu .macc-body{display:none;padding-left:6px}
  .menu .macc.open .macc-body{display:block}
  .menu button{display:flex;width:100%;align-items:center;gap:11px;text-align:left;background:transparent;border:0;border-radius:7px;padding:7px 10px;cursor:pointer;color:var(--text)}
  .menu button:hover,.menu button.sel{background:var(--hover)}
  .menu .ic{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--accent2);font-family:"Shippori Mincho B1",serif}
  .menu .nm{font-size:13px}
  .menu .dv{height:1px;background:var(--line);margin:5px 2px}

  /* ── しおり（左サイドバー・開閉可） ── */
  .outline{position:fixed;top:var(--topbar-h,92px);left:0;width:236px;height:calc(100vh - var(--topbar-h,92px));overflow:hidden;background:var(--card);
    border-right:1px solid var(--line);z-index:90;padding:0;transform:translateX(-100%);
    transition:transform .18s;box-shadow:2px 0 14px rgba(0,0,0,.05);display:flex;flex-direction:column}
  .outline.open{transform:none}
  .ol-list{flex:1;overflow:auto;padding:10px 4px}
  .ol-count{flex:none;border-top:1px solid var(--line);padding:9px 14px;font-size:11.5px;color:var(--muted);letter-spacing:.04em;background:var(--card)}
  .outline .ol-ttl{font-size:11px;letter-spacing:.2em;color:var(--muted);padding:4px 12px 9px;
    border-bottom:1px solid var(--line);margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
  .outline .ol-x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 4px}
  .outline .ol-x:hover{color:var(--text)}
  .outline a{display:block;text-decoration:none;color:var(--accent);font-size:12.5px;line-height:1.5;
    padding:5px 12px;border-left:2px solid transparent;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .outline a:hover{background:var(--hover);color:var(--text);border-left-color:var(--accent2)}
  .outline a.lv2{padding-left:24px;font-size:12px}
  .outline a.lv3{padding-left:36px;font-size:12px;color:var(--accent)}
  .outline a.lv4{padding-left:48px;font-size:11.5px;color:var(--accent2)}
  .outline a.lv5{padding-left:60px;font-size:11.5px;color:var(--accent2)}
  .outline .ol-empty{padding:12px;color:var(--muted);font-size:12px}
  .outline .ol-page{display:flex;align-items:center;gap:3px;padding:3px 8px 3px 8px;cursor:pointer;border-top:1px solid var(--line);font-weight:700;font-size:12.5px;color:var(--text)}
  .outline .ol-page:hover{background:var(--hover)}
  .outline .ol-page.cur{background:var(--hover);box-shadow:inset 3px 0 0 var(--red)}
  .outline .ol-page .ol-tw{display:inline-block;width:12px;text-align:center;color:var(--muted);font-size:10px;transition:transform .12s;flex:0 0 12px}
  .outline .ol-pgroup.open>.ol-page .ol-tw{transform:rotate(90deg)}
  .outline .ol-page .ol-pname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .outline .ol-page .ol-pedit,.outline .ol-page .ol-pdel,.outline .ol-page .ol-pmv,.outline .ol-page .ol-pdup{opacity:0;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;padding:0 3px;border-radius:4px}
  .outline .ol-page .ol-pmv{font-size:9px;padding:0 1px}
  .outline .ol-page:hover .ol-pedit,.outline .ol-page:hover .ol-pdel,.outline .ol-page:hover .ol-pmv,.outline .ol-page:hover .ol-pdup{opacity:1}
  .outline .ol-page .ol-pedit:hover,.outline .ol-page .ol-pdel:hover,.outline .ol-page .ol-pmv:hover,.outline .ol-page .ol-pdup:hover{background:var(--card);color:var(--text)}
  .outline .ol-heads{display:none}
  .outline .ol-pgroup.open>.ol-heads{display:block}
  .outline .ol-hrow{display:flex;align-items:center;gap:3px;cursor:pointer;font-size:12.5px;line-height:1.5;color:var(--accent);padding:2px 8px}
  .outline .ol-hrow:hover{background:var(--hover);color:var(--text)}
  .outline .ol-hrow.lv2{padding-left:22px;font-size:12px}
  .outline .ol-hrow.lv3{padding-left:34px;font-size:12px;color:var(--accent)}
  .outline .ol-hrow.lv4{padding-left:46px;font-size:11.5px;color:var(--accent2)}
  .outline .ol-hrow.lv5{padding-left:58px;font-size:11.5px;color:var(--accent2)}
  .outline .ol-hrow .ol-tw{display:inline-block;width:12px;flex:0 0 12px;text-align:center;color:var(--muted);font-size:10px;transition:transform .12s}
  .outline .ol-hrow .ol-tw-e{visibility:hidden}
  .outline .ol-hgroup.open>.ol-hrow .ol-tw{transform:rotate(90deg)}
  .outline .ol-htext{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .outline .ol-hkids{display:none}
  .outline .ol-hgroup.open>.ol-hkids{display:block}
  .outline .ol-add{display:block;width:calc(100% - 16px);margin:6px 8px 4px;padding:4px;font-size:11.5px;color:var(--muted);background:transparent;border:1px dashed var(--line);border-radius:6px;cursor:pointer}
  .outline .ol-add:hover{background:var(--hover);color:var(--text)}
  .print-toc .pt-p{font-weight:800;font-size:1.05em;margin:10px 0 4px;letter-spacing:.04em}
  @media (min-width:821px){ body.ol-open .wrap{margin-left:300px;margin-right:auto;max-width:min(920px,calc(100vw - 340px))} }
  .rbar{position:fixed;top:var(--topbar-h,92px);right:0;width:212px;height:calc(100vh - var(--topbar-h,92px));overflow-y:auto;background:var(--card);border-left:1px solid var(--line);z-index:90;transform:translateX(100%);transition:transform .18s;padding:0 0 24px}
  .rbar.open{transform:none}
  .rbar .rb-ttl{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13px;padding:12px 12px 6px;color:var(--text)}
  .rbar .rb-x{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:0 4px}
  .rbar .rb-hint{font-size:11px;color:var(--muted);padding:0 12px 9px;border-bottom:1px solid var(--line)}
  .rbar .rb-cat{font-size:10px;letter-spacing:.12em;color:var(--muted);padding:10px 12px 3px}
  .rbar .rb-item{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--text);cursor:pointer;padding:6px 12px;font-size:13px;text-align:left;font-family:inherit}
  .rbar .rb-item:hover{background:var(--hover)}
  .rbar .rb-item .ic{width:18px;text-align:center;color:var(--muted);flex:none}
  .rbar .macc-h{display:flex;align-items:center;gap:6px;padding:8px 12px;font-size:10px;letter-spacing:.12em;color:var(--muted);cursor:pointer;user-select:none}
  .rbar .macc-h:hover{background:var(--hover);color:var(--text)}
  .rbar .macc-h .tw{display:inline-block;transition:transform .12s}
  .rbar .macc.open .macc-h .tw{transform:rotate(90deg)}
  .rbar .macc-body{display:none}
  .rbar .macc.open .macc-body{display:block}
  .hm-item.on{color:var(--red);font-weight:700}
  @media (min-width:821px){ body.rb-open .wrap{margin-right:242px} body.ol-open.rb-open .wrap{max-width:min(920px,calc(100vw - 580px))} }

  /* ── ファイル管理ダイアログ ── */
  .ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:300;padding:18px}
  .ovl.show{display:flex}
  .dlg{background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:460px;width:100%;max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
  .dlg-h{font-weight:800;font-size:15px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .dlg-b{padding:16px 20px;overflow:auto}
  .dlg-f{padding:12px 20px;border-top:1px solid var(--line);text-align:right}
  .frow{display:flex;gap:8px;margin:0 0 10px}
  .frow input{flex:1;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);padding:0 10px;font-size:13px;font-family:inherit}

  function buildPdf(canvas,heads,scale){
    var jsPDF=window.jspdf.jsPDF;
    var pdf=new jsPDF({unit:'pt',format:'a4',compress:true});
    var pageW=pdf.internal.pageSize.getWidth(), pageH=pdf.internal.pageSize.getHeight();
    var marginY=30, minMarginX=30;

    var desiredWpt=colPx*72/96;                    // same physical size as browser (96dpi)
    var availWpt=pageW-2*minMarginX;
    var drawWpt=Math.min(desiredWpt, availWpt);    // shrink only if wider than the page
    var marginX=(pageW-drawWpt)/2;                 // center horizontally
    var contentHpt=pageH-2*marginY;
    var pxPerPt=canvas.width/drawWpt;
    var sliceH=Math.max(1,Math.floor(contentHpt*pxPerPt));
    var total=canvas.height, pages=Math.max(1,Math.ceil(total/sliceH));
    for(var p=0;p<pages;p++){

      var tmp=document.createElement('canvas'); tmp.width=canvas.width; tmp.height=sh;
      var g=tmp.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,tmp.width,tmp.height);

      pdf.addImage(tmp.toDataURL('image/jpeg',0.92),'JPEG',marginX,marginY,drawWpt,sh/pxPerPt);
    }
    if(pdf.outline&&pdf.outline.add){
      var last={};
      heads.forEach(function(hd){
        var pg=Math.min(pages,Math.floor((hd.y*scale)/sliceH)+1);
        var parent=null; for(var L=hd.lv-1;L>=1;L--){ if(last[L]){ parent=last[L]; break; } }
        var node=pdf.outline.add(parent,hd.t||'(無題)',{pageNumber:pg});
        last[hd.lv]=node; for(var d=hd.lv+1;d<=6;d++) last[d]=null;
      });
    }
    pdf.save((state.name||'scenario')+'.pdf');
  }

    return fetch(url).then(function(r){ if(!r.ok) throw new Error('font '+r.status); return r.arrayBuffer(); }).then(function(buf){

  function splitTextByLines(node){

    for(var i=1;i<=txt.length;i++){

      if(lastTop===null){ lastTop=rc.top; }
      else if(rc.top-lastTop>2){ r.setStart(node,start); r.setEnd(node,i-1); var bb=r.getBoundingClientRect(); segs.push({text:txt.slice(start,i-1),left:bb.left,top:bb.top}); start=i-1; lastTop=rc.top; }

  function buildPdfSandwich(renders, scale){

        var tmp=document.createElement('canvas'); tmp.width=canvas.width; tmp.height=sh;

  }

    return merged;
  }
  var pushTimer=null, pushing=false, lastPushAt=0, backoffUntil=0, backoffMs=0;
  var PUSH_DEBOUNCE=4000, MIN_PUSH_GAP=15000;
  function statusMsg(s){ return s===401?'トークン無効':s===403?'権限不足かレート制限':s===404?'Gistが見つからない':s===422?'データ不正':('エラー'+s); }
  function doPush(retry){
    pushing=true;
    var files={}; files[ghFile()]={content:JSON.stringify(exportCloud())};
    return ghFetch('/gists/'+ghGist,{method:'PATCH',body:JSON.stringify({files:files})}).then(function(r){
      if(r.ok){ lastPushAt=Date.now(); backoffMs=0; backoffUntil=0; saveInd.textContent='同期済 '+now(); pushing=false; return; }
      if(r.status===404 && retry<1){
        ghGist=''; try{localStorage.removeItem('scn_gh_gist_shared');}catch(e){}
        return findSharedGist().then(function(gid){
          if(gid){ ghGist=gid; try{localStorage.setItem('scn_gh_gist_shared',gid);}catch(e){} return doPush(retry+1); }
          var f={}; f[ghFile()]={content:JSON.stringify(exportCloud())};
          return ghFetch('/gists',{method:'POST',body:JSON.stringify({description:SHARED_DESC,public:false,files:f})}).then(function(rr){ return rr.ok?rr.json():null; }).then(function(gd){
            if(gd&&gd.id){ ghGist=gd.id; try{localStorage.setItem('scn_gh_gist_shared',gd.id);}catch(e){} lastPushAt=Date.now(); saveInd.textContent='同期済（Gist再作成） '+now(); }
            else saveInd.textContent='同期失敗（Gist再作成不可／ローカルは保存済）';
            pushing=false;
          });
        });
      }
      if(r.status===403 || r.status===429){
        var ra=parseInt((r.headers&&r.headers.get&&r.headers.get('retry-after'))||'',10);
        var reset=parseInt((r.headers&&r.headers.get&&r.headers.get('x-ratelimit-reset'))||'',10);
        var w=!isNaN(ra)?ra*1000:(!isNaN(reset)?Math.max(0,reset*1000-Date.now()):0);
        if(!w) w=backoffMs?Math.min(backoffMs*2,300000):30000; else w=Math.min(Math.max(w,20000),300000);
        backoffMs=w; backoffUntil=Date.now()+w; pushing=false;
        saveInd.textContent='同期を一時停止中（レート制限・約'+Math.round(w/1000)+'秒後に自動再開／ローカルは保存済）';
        schedulePush(); return;
      }
      saveInd.textContent='同期失敗（'+statusMsg(r.status)+'／ローカルは保存済）'; pushing=false;
    }).catch(function(){ pushing=false; backoffUntil=Date.now()+15000; saveInd.textContent='同期失敗（通信エラー・自動再試行します／ローカルは保存済）'; schedulePush(); });
  }
  function schedulePush(){
    if(!ghConnected()||!ghGist) return;
    if(pushTimer) clearTimeout(pushTimer);
    var now=Date.now(), due=Math.max(now+PUSH_DEBOUNCE, lastPushAt+MIN_PUSH_GAP, backoffUntil);
    pushTimer=setTimeout(function(){ pushTimer=null; if(pushing){ schedulePush(); return; } doPush(0); }, Math.max(0, due-now));
  }
  function cloudPush(){ schedulePush(); }
  function updateAcct(){
    var lb=document.getElementById('acctLabel'), btn=document.getElementById('btnAuth'), sy=document.getElementById('btnSync');
    if(!ghConnected()){ lb.textContent='未接続（ローカル保存）'; btn.textContent='GitHub連携'; if(sy) sy.style.display='none'; }
    else{ lb.textContent='ID: '+ghId(); btn.textContent='連携解除'; if(sy) sy.style.display=''; }
  }
  function findSharedGist(){
    if(ghGist) return Promise.resolve(ghGist);
    return ghFetch('/gists?per_page=100').then(function(r){ return r.ok?r.json():null; }).then(function(gists){
      if(!Array.isArray(gists)) return '';
      var g=gists.filter(function(x){ return (x.description===SHARED_DESC) || (x.files && x.files['user-'+ghId()+'.json']); })[0];
      return g?g.id:'';
    }).catch(function(){ return ''; });
  }
  function ghConnect(id,token){
    var hint=document.getElementById('loginHint'); hint.textContent='接続中…';
    id=(id||'').trim().replace(/[^0-9A-Za-z_\-一-龠ぁ-んァ-ヶ]/g,'') || 'default';
    var prevAccount=account, prevToken=ghToken, prevGist=ghGist;
    ghToken=token; account='id_'+id;
    function fail(msg){ account=prevAccount; ghToken=prevToken; ghGist=prevGist; throw new Error(msg); }
    var SCOPE_HELP='このトークンではGistを読み書きできません（404）。\n・GitHubの「classic」トークン作成時に「gist」のチェックを必ず入れてください（これが未チェックだと必ず404になります）。\n・複数人／複数端末では全員が「同じトークン」を使ってください（別トークンだと他人のGistは編集できません）。';
    function createGist(){
      var files={}; files[ghFile()]={content:JSON.stringify(exportCloud())};
      return ghFetch('/gists',{method:'POST',body:JSON.stringify({description:SHARED_DESC,public:false,files:files})}).then(function(r){
        if(!r.ok){ if(r.status===404||r.status===403) return fail(SCOPE_HELP); return fail('Gistの作成に失敗しました（'+statusMsg(r.status)+'）。'); }
        return r.json();
      }).then(function(gd){ if(!gd||!gd.id) return fail('Gistの作成に失敗しました。'); ghGist=gd.id; });
    }
    return ghFetch('/user').then(function(r){ if(!r.ok) return fail('認証に失敗しました。トークンが正しいか確認してください。'); return r.json(); })
      .then(function(){ ghGist=''; return findSharedGist(); })   /* キャッシュは使わず、現トークンのGistを再解決 */
      .then(function(gid){
        if(!gid) return createGist();
        ghGist=gid;
        return ghFetch('/gists/'+gid).then(function(r){ return r.ok?r.json():null; }).then(function(gd){
          var f=gd&&gd.files&&gd.files[ghFile()]; if(f&&f.content){ try{ importCloud(JSON.parse(f.content)); }catch(e){} }
          var files={}; files[ghFile()]={content:JSON.stringify(exportCloud())};
          return ghFetch('/gists/'+gid,{method:'PATCH',body:JSON.stringify({files:files})}).then(function(rr){
            if(rr.ok) return;
            ghGist=''; return createGist();   /* 見つかったGistに書けない → 現トークンで作り直す */
          });
        });
      })
      .then(function(){
        try{ localStorage.setItem('scn_account',account); localStorage.setItem('scn_gh_token',token); localStorage.setItem('scn_gh_gist_shared',ghGist); }catch(e){}
        if(!load()){ newDoc('無題のシナリオ'); } else { render(); applyOutline(); updateDocName(); }
        updateAcct(); setTopbar(); loginOvl.classList.remove('show'); saveInd.textContent='GitHub同期 有効';
      });
  }
  var lastPullAt=0;
  function ghPull(force){
    if(!ghConnected()) return;
    var nowMs=Date.now();
    if(!force && (nowMs-lastPullAt < 8000)) return; /* 8秒以内の連続取得は間引き（レート制限回避） */
    if(!ghGist){ ghGist=(function(){try{return localStorage.getItem('scn_gh_gist_shared')||'';}catch(e){return '';}})(); }
    if(!ghGist){ findSharedGist().then(function(gid){ if(gid){ ghGist=gid; try{localStorage.setItem('scn_gh_gist_shared',gid);}catch(e){} ghPull(force); } }); return; }
    if((pushTimer||pushing) && !force) return; /* 未送信のローカル編集がある間は取得しない（巻き戻り防止／送信を優先） */
    lastPullAt=nowMs;
    ghFetch('/gists/'+ghGist).then(function(r){ if(!r.ok){ if(force) saveInd.textContent='取得失敗（'+statusMsg(r.status)+'）'; return null; } return r.json(); }).then(function(gd){
      if(!gd) return; var f=gd.files&&gd.files[ghFile()];
      if(f && f.content){
        var incoming=f.content, localNow='';
        try{ localNow=JSON.stringify(exportCloud()); }catch(e){}
        if(incoming!==localNow){
          var rd=null; try{ rd=JSON.parse(incoming); }catch(e){}
          if(rd){
            var merged=mergeCloud(rd);
            importCloud(merged);
            var curRemote=merged.docs[state.id];
            if(!saveTimer && curRemote && (curRemote.updated||0) > (state.updated||0)){
              if(load()){ applyingSnap=true; render(); applyOutline(); updateDocName(); lastSnap=snapshot(); applyingSnap=false; }
              saveInd.textContent='最新を取得 '+now();
            } else if(force){ saveInd.textContent='同期済み '+now(); }
            /* ローカルにリモートより新しい文書があればリモートへ反映（巻き戻り防止） */
            try{ if(JSON.stringify(merged)!==incoming && typeof cloudPush==='function') cloudPush(); }catch(e){}
          }
        } else if(force){ saveInd.textContent='同期済み（最新）'; }
      } else if(force){ saveInd.textContent='この端末のデータはまだ未送信です'; }
    }).catch(function(){ if(force) saveInd.textContent='取得に失敗しました（通信エラー）'; });
  }
  function ghRefresh(){ ghPull(true); }
  var loginOvl=document.getElementById('loginOvl');
  document.getElementById('btnAuth').onclick=function(){
    hmenu.classList.remove('show');
    if(ghConnected()){ if(confirm('連携を解除しますか？（この端末はローカル保存に戻ります。Gistのデータは残ります）')){ ghToken=''; ghGist=''; try{localStorage.removeItem('scn_gh_token');}catch(e){} account='local'; try{localStorage.setItem('scn_account','local');}catch(e){} if(!load()){ newDoc('無題のシナリオ'); } else { render(); applyOutline(); updateDocName(); } updateAcct(); setTopbar(); } return; }
    document.getElementById('ghId').value=ghId()||''; document.getElementById('ghToken').value=ghToken||'';
    document.getElementById('loginHint').textContent='同じトークンを共有し、各自が異なるIDを入れると、IDごとに分かれて保存されます。';
    loginOvl.classList.add('show'); document.getElementById('ghId').focus();
  };
  document.getElementById('loginClose').onclick=function(){ loginOvl.classList.remove('show'); };
  loginOvl.onclick=function(e){ if(e.target===loginOvl) loginOvl.classList.remove('show'); };
  document.getElementById('loginGo').onclick=function(){
    var id=document.getElementById('ghId').value.trim(); var tk=document.getElementById('ghToken').value.trim();
    if(!id){ document.getElementById('loginHint').textContent='IDを入力してください。'; return; }
    if(!tk){ document.getElementById('loginHint').textContent='トークンを入力してください。'; return; }
    ghConnect(id,tk).catch(function(err){ document.getElementById('loginHint').textContent=(err&&err.message)||'接続に失敗しました。'; });
  };
  (function(){ var sb=document.getElementById('btnSync'); if(sb) sb.onclick=function(){ hmenu.classList.remove('show'); saveInd.textContent='同期中…'; ghPull(true); }; })();
  window.addEventListener('focus',function(){ refreshFromStore(); ghPull(false); });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden){ refreshFromStore(); ghPull(false); } });
  window.addEventListener('pageshow',function(e){ if(e && e.persisted){ refreshFromStore(); ghPull(false); } });
  setInterval(function(){ ghPull(false); }, 30000);

  /* ---- 初期化 ---- */
  if(!load()){
    var sk=newBlock('skill','＜目星＞');
    sk.children=[ newBlock('toggle','成功情報'), newBlock('toggle','失敗情報') ];
    sk.children[0].children=[ newBlock('p','成功時の描写をここに。') ];
    sk.children[1].children=[ newBlock('p','失敗時の描写をここに。') ];
    var kp=newBlock('kp','KP情報');
    kp.children=[ newBlock('p','ここにKPのみ知る情報。塗りつぶしの枠に白抜きで表示されます。') ];
    var sec=newBlock('secret','▊秘匿');
    sec.children=[ newBlock('p','ここに秘匿情報') ];
    state.id=docId(); state.name='サンプルシナリオ';
    state.blocks=[
      newBlock('title','サンプルシナリオ'),
      newBlock('tagline','サンプル×シナリオ×です'),
      newBlock('h1','あらすじ'),
      newBlock('p','ここにあらすじなどを入力'),
      newBlock('p','Notionと似た感覚で編集可能'),
      sk, kp, sec,
      newBlock('p','')
    ];
    persist();
  }
  buildPalettes(); buildFontSelect();
  document.addEventListener('keydown',function(e){
    var mod=e.ctrlKey||e.metaKey; if(!mod) return;
    var k=e.key.toLowerCase();
    if(k==='z'&&!e.shiftKey){ e.preventDefault(); undo(); }
    else if((k==='z'&&e.shiftKey)||k==='y'){ e.preventDefault(); redo(); }
  });
  lastSnap=snapshot();
  if(window.innerWidth<=820) state.outlineOpen=false;
  function setTopbar(){ var hd=document.querySelector('.head'), fb2=document.querySelector('.fbar'); var hh=hd?hd.offsetHeight:0; var h=hh+(fb2?fb2.offsetHeight:0); if(hh>0) document.documentElement.style.setProperty('--head-h', hh+'px'); if(h>0) document.documentElement.style.setProperty('--topbar-h', h+'px'); }
  window.addEventListener('resize', setTopbar);
  (function(){ var fb=document.getElementById('fbar'), tg=document.getElementById('fbarToggle'); if(tg) tg.onclick=function(){ fb.classList.toggle('open'); setTopbar(); }; })();
  (function(){ var ins=document.getElementById('fbarIns'); if(!ins) return; ins.onmousedown=function(e){ e.preventDefault(); }; ins.onclick=function(e){ e.stopPropagation(); var id=focusedId; if(!id){ var bs=state.blocks; id=bs.length?bs[bs.length-1].id:null; } if(!id) return; openBlockMenu(id, ins); }; })();
  /* iOS: ソフトキーボードで表示領域がずれても、上部ヘッダー・書式バーを表示領域の上端に固定する */
  (function(){
    var isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    if(!isIOS || !window.visualViewport) return;
    var vv=window.visualViewport, raf=0;
    function apply(){ raf=0; var head=document.querySelector('.head'), fbar=document.getElementById('fbar'); var y=Math.max(0,Math.round(vv.offsetTop)); var t=y?('translateY('+y+'px)'):''; if(head) head.style.transform=t; if(fbar) fbar.style.transform=t; }
    function pin(){ if(!raf) raf=requestAnimationFrame(apply); }
    vv.addEventListener('resize', pin); vv.addEventListener('scroll', pin); window.addEventListener('scroll', pin, {passive:true});
    document.addEventListener('focusin', function(){ setTimeout(pin, 60); setTimeout(pin, 300); });
  })();
  render(); applyOutline(); applyRightMenu(); updateDocName(); updateAcct(); setTopbar(); ghRefresh(); saveInd.textContent=(ghConnected()?'GitHub同期 有効':'自動保存 有効');
  reconcileFromIdb();

  window.__ed={ state:state, TYPES:TYPES, newBlock:newBlock, render:render, persist:persist, load:load,
    IDX:IDX, DOCP:DOCP, CUR:CUR, readIndex:readIndex, openDoc:openDoc, newDoc:newDoc, deleteDoc:deleteDoc,
    ctx:ctx, sanitize:sanitize, isCtn:isCtn, isCallout:isCallout, exportHTML:exportHTML,
    staticBlockHTML:staticBlockHTML, setRowUl:setRowUl,
    menuItems:function(f){ menuMode='slash'; buildMenuItems(f); return menu.innerHTML; },
    getState:function(){return state;},
    applyFs:applyFs, applyTheme:applyTheme, renderOutline:renderOutline, applyOutline:applyOutline, reconcileFromIdb:reconcileFromIdb };
})();
</script>
